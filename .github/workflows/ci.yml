# CI-grindar för Kronkoll (KK-16, KK-12, KK-31).
# Branch protection kräver bara statuskontrollen "ci-ok". Den blir grön först när
# alla jobb i `needs` är gröna. Nya grindar (lint, typecheck, unit, coverage,
# integration, mutation, e2e) läggs till i `needs` under M0, utan att rulesetet ändras.
# PR-reglerna (storlek, beskrivning) beskrivs i AGENTS.md.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11
          ./actionlint -color
      - name: Actions pinnade på commit-SHA och permissions satta (KK-31-A)
        run: |
          fail=0
          if grep -rnE '^\s*-?\s*uses:\s*[^.][^ ]*@' .github/workflows | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "::error::Alla 'uses:' måste pinnas på en fullständig commit-SHA"; fail=1
          fi
          for f in .github/workflows/*.yml; do
            grep -qE '^permissions:' "$f" || { echo "::error file=$f::Saknar explicit 'permissions:' på toppnivå"; fail=1; }
          done
          exit $fail

  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Små PR:er (≤ 400 mål, > 800 kräver etiketten large-pr)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_BIG_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'large-pr') }}
        run: |
          changed=$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- . \
            ':(exclude,glob)plans/**/*.html' \
            ':(exclude,glob)**/pnpm-lock.yaml' ':(exclude,glob)**/package-lock.json' \
            ':(exclude,glob)**/__snapshots__/**' \
            ':(exclude,glob)**/migrations/meta/**' \
            | awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }')
          echo "Ändrade rader (exkl. genererade filer): $changed"
          echo "### PR-storlek: $changed ändrade rader" >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt 800 ]; then
            if [ "$HAS_BIG_LABEL" = "true" ]; then
              echo "::warning::$changed rader, tillåtet tack vare etiketten large-pr. Motivera i beskrivningen."
            else
              echo "::error::$changed rader är för stort (> 800). Dela upp PR:en, eller sätt etiketten large-pr och motivera."
              exit 1
            fi
          elif [ "$changed" -gt 400 ]; then
            echo "::warning::$changed rader är över målet på 400. Går den att dela upp?"
          fi

  pr-description:
    name: pr-description
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Titel och beskrivning skrivna för människor (AGENTS.md)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python3 {0}
        run: |
          import os, re, sys
          title = os.environ.get("PR_TITLE", "").strip()
          body = os.environ.get("PR_BODY", "") or ""
          errors = []
          if not 10 <= len(title) <= 72:
              errors.append(f"Titeln ska vara 10–72 tecken (nu {len(title)}).")
          if re.match(r"(?i)^(wip|update|fix|misc|test)\b[:\s]*\S{0,20}$", title):
              errors.append("Titeln ska beskriva effekten, inte vara generisk (t.ex. 'Update …', 'WIP').")
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          sections = {}
          for part in re.split(r"(?m)^##\s+", body)[1:]:
              head, _, text = part.partition("\n")
              sections[head.strip().lower()] = text.strip()
          required = ["What and why", "How to test", "How we know it works", "Open questions and decisions"]
          for h in required:
              text = sections.get(h.lower())
              if text is None:
                  errors.append(f"Rubriken '## {h}' saknas.")
              elif len(text) < 5:
                  errors.append(f"Avsnittet '{h}' är tomt (skriv 'None' om det verkligen inte finns något).")
          for e in errors:
              print(f"::error::{e}")
          if errors:
              print("Se .github/pull_request_template.md och AGENTS.md → Pull requests.")
              sys.exit(1)
          print("Titel och beskrivning OK.")

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc -p tsconfig.json
      # Samma bygge som deploy kör, så att ett trasigt bygge stoppas före merge.
      - name: Bygg webbappen
        run: pnpm --filter @kronkoll/web build

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Unit-tester med coverage-tröskel (domain ≥ 90 %)
        run: pnpm test:coverage

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Domänlagret är rent och inga betalnings-endpoints (KK-14-A, KK-5-A)
        run: pnpm architecture

  ci-ok:
    name: ci-ok
    if: always()
    needs: [secret-scan, workflow-lint, pr-size, pr-description, lint, typecheck, unit, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Alla grindar gröna?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultat: $RESULTS"
          for r in $RESULTS; do
            # "skipped" är ok: PR-kontrollerna körs inte vid push till main och pr-description inte för Dependabot
            case "$r" in success|skipped) ;; *) echo "::error::Minst en grind är inte grön ($r)"; exit 1 ;; esac
          done
