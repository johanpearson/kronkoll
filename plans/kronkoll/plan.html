  return svgGraph(nodes, edges, { id: 'arch', w: 160, gx: 100 }) + `<div class="grid2">${comps.map(archCard).join('')}</div>`;
}

</script>
<script>/* viewer-panels.js */
/* reqplan viewer - Overview, Decisions, Delivery, Traceability, Review tabs and the right-hand inspector. */
'use strict';

// ───────── overview ─────────

const PANEL_COUNT_STATS = [
  { key: 'screens', label: 'Screens', sub: 'clickable prototype', tab: 'prototype' },
  { key: 'interfaces', label: 'Interfaces', sub: 'APIs · events · CLI · jobs', tab: 'system' },
  { key: 'flows', label: 'Flows', sub: 'sequence · state · process', tab: 'system' },
  { key: 'entities', label: 'Entities', sub: 'data model', tab: 'system' },
  { key: 'questions', label: 'Open questions', sub: 'need a decision', tone: 'warn', tab: 'decisions' },
];

function stat(s) {
  return `<button class="stat ${s.tone || ''}" data-act="tab" data-id="${s.tab}"><div class="sl">${esc(s.label)}</div><div class="sv">${esc(s.value)}</div><div class="ss">${esc(s.sub)}</div></button>`;
}

function coverageTone(st) {
  if (st.uncovered) return 'bad';
  return st.partial ? 'warn' : 'ok';
}

function coreStats(st) {
  return [
    { label: 'Requirement coverage', value: st.coveragePct + '%', sub: `${st.covered} covered · ${st.partial} partial · ${st.uncovered} missing`, tone: coverageTone(st), tab: 'trace' },
    { label: 'In scope', value: st.inScope, sub: `${st.deferred} deferred${st.synthetic ? ` · ${st.synthetic} synthetic` : ''}`, tab: 'trace' },
    { label: 'Acceptance criteria traced', value: `${st.acsTraced}/${st.acsInScope}`, sub: 'linked to concrete plan items', tone: st.acsTraced < st.acsInScope ? 'warn' : 'ok', tab: 'trace' },
  ];
}

function statsBlock(st) {
  const counts = PANEL_COUNT_STATS.filter((c) => st[c.key]).map((c) => ({ ...c, value: st[c.key] }));
  return `<div class="stats">${[...coreStats(st), ...counts].map(stat).join('')}</div>`;
}

function coverageBar(st) {
  const tot = Math.max(1, st.inScope);
  const parts = [['covered', st.covered], ['partial', st.partial], ['uncovered', st.uncovered]];
  return `<div class="covbar" title="covered / partial / missing">${parts.map(([c, n]) => `<span class="${c}" style="width:${(n / tot) * 100}%"></span>`).join('')}</div>`;
}

function issueItem(i) {
  const body = i.at ? `<button data-act="reveal" data-key="${esc(i.at)}">${esc(i.message)}</button>` : `<span>${esc(i.message)}</span>`;
  return `<li><span class="lvl ${i.level}">${i.level}</span>${body}</li>`;
}

function issuesBlock() {
  const main = A.issues.filter((i) => i.level !== 'info');
  const info = A.issues.filter((i) => i.level === 'info');
  const mainHtml = main.length ? `<ul class="issues">${main.map(issueItem).join('')}</ul>` : '<div class="okmsg">✓ All references resolve and every in-scope requirement is covered.</div>';
  const infoHtml = info.length ? `<details><summary>${info.length} notes</summary><ul class="issues">${info.map(issueItem).join('')}</ul></details>` : '';
  return `<h2>Plan health</h2>${mainHtml}${infoHtml}`;
}

function syntheticCard(s) {
  return `<div class="card"><div class="ch">${refChip(s.id)}<b>${esc(s.title)}</b><span class="badge syn">synthetic</span></div><div class="stmt">${inl(s.statement)}</div>${s.rationale ? `<div class="small muted">Why: ${inl(s.rationale)}</div>` : ''}</div>`;
}

function syntheticBlock() {
  if (!A.synthetic.length) return '';
  return `<h2>Synthetic requirements <span class="muted small">proposed by this plan, not yet in the source</span></h2>${A.synthetic.map(syntheticCard).join('')}`;
}

function upstreamItems() {
  return [
    ...A.reqs.open_questions.map((o) => ['Open question', o]),
    ...A.reqs.conflicts.map((o) => ['Conflict', o]),
    ...A.reqs.assumptions.map((o) => ['Assumption', o]),
  ];
}

function severityClass(level) {
  return level === 'blocking' || level === 'high' ? 'bad' : '';
}

function upstreamCard([k, o]) {
  return `<div class="card"><div class="ch"><span class="kind">${k}</span><code>${esc(o.id)}</code>${o.status ? `<span class="badge">${esc(o.status)}</span>` : ''}${o.level ? `<span class="badge ${severityClass(o.level)}">${esc(o.level)}</span>` : ''}</div>` +
    `<div>${inl(o.text)}</div>${o.answer ? `<div class="muted small">Answer: ${inl(o.answer)}</div>` : ''}<div>${chips(o.related)}</div></div>`;
}

function upstreamBlock() {
  const rel = ([, o]) => !arr(o.related).length || arr(o.related).some((id) => A.scopeIds.has(id));
  const items = upstreamItems().filter(rel);
  if (!items.length) return '';
  return `<h2>Upstream context <span class="muted small">from the requirements source</span></h2>${items.map(upstreamCard).join('')}`;
}

function inspectLabel() {
  return `Inspect${isReview() ? ' / comment' : ''}`;
}

function themeSummary() {
  if (!A.theme.explicit) return 'Product Oracle SV style (default)';
  return `${esc(A.theme.preset)} + ${Object.keys((P.theme || {}).tokens || {}).length} token overrides`;
}

function themeNodeButton() {
  return A.nodeByKey.has('theme') ? `<button class="ghost sm" data-act="sel-node" data-key="theme">${inspectLabel()}</button>` : '';
}

function themeSatisfies() {
  if (!A.nodeByKey.has('theme')) return '';
  return `<div><span class="muted small">satisfies </span>${chips(A.nodeByKey.get('theme').satisfies) || '<span class="faint small">nothing</span>'}</div>`;
}

function stylingBlock() {
  if (!arr(P.screens).length) return '';
  const note = A.theme.explicit ? '' : '<div class="muted small">No styling requirements were expressed in the plan, so the prototype uses the SV style.</div>';
  return `<h2>Styling <span class="muted small">prototype look</span></h2><div class="card"><div class="ch"><span class="kind">◑ Theme</span>` +
    `<b class="grow">${themeSummary()}</b>${themeNodeButton()}</div>${note}${themeFacts()}${themeSatisfies()}</div>`;
}

function briefStatus(s) {
  if (s.kind !== 'brief') return '';
  return s.confirmed ? ' · confirmed by the user' : ' · not confirmed by the user yet';
}

function sourceRow(s) {
  return `<dt>${esc(s.kind)}</dt><dd>${esc(s.label)}${s.exported_at ? ` · exported ${esc(s.exported_at)}` : ''}${s.note ? ` · ${esc(s.note)}` : ''}${briefStatus(s)}</dd>`;
}

function briefBlock() {
  const briefs = A.reqs.sources.filter((s) => s.kind === 'brief' && s.brief);
  if (!briefs.length) return '';
  return `<h2>The brief <span class="muted small">what was asked for, in the user's words</span></h2>${briefs.map((s) => `<div class="card"><div class="md">${mdx(s.brief)}</div></div>`).join('')}`;
}

const CHANGE_ORDER = ['new', 'changed', 'removed', 'existing'];
const CHANGE_HINT = { new: 'added by this plan', changed: 'already there, modified', removed: 'taken out', existing: 'stays as it is, shown for context' };

function codebaseLine(cb) {
  if (!cb) return '';
  const root = cb.root ? ` · root <code>${esc(cb.root)}</code>` : '';
  return `<div class="muted small"><b>${esc(cb.name || 'Codebase')}</b>${root}${cb.note ? ` · ${inl(cb.note)}` : ''}</div>`;
}

function changeGroup(change) {
  const keys = A.changes.items.filter((it) => it.change === change).map((it) => it.key);
  if (!keys.length) return '';
  return `<div class="chgrow"><div><span class="chg ${change}">${CHANGE_LABEL[change]} · ${keys.length}</span> <span class="muted small">${CHANGE_HINT[change]}</span></div><div>${keys.map(nodeChip).join('')}</div></div>`;
}

function alreadyMetLine() {
  const ids = A.changes.alreadyMet;
  return ids.length ? `<div class="chgrow"><span class="muted small">Already met by existing code: </span>${chips(ids)}</div>` : '';
}

function changesBlock() {
  const ch = A.changes;
  if (!ch.used && !ch.codebase) return '';
  return `<h2>What changes <span class="muted small">in the existing codebase</span></h2><div class="card">${codebaseLine(ch.codebase)}${CHANGE_ORDER.map(changeGroup).join('')}${alreadyMetLine()}</div>`;
}

function planSourceRow() {
  return `<dt>Plan</dt><dd>${esc(D.plan_file || '(loaded in browser)')}${D.built_at ? ` · built ${esc(D.built_at)}` : ''}</dd>`;
}

function sourcesBlock() {
  const r = A.reqs;
  const product = r.product ? `<dt>Product</dt><dd>${esc(r.product.name)}</dd>` : '';
  const revision = r.revision ? `<dt>Revision</dt><dd>${esc(r.revision.version || r.revision.id)} (${esc(r.revision.status)})</dd>` : '';
  return `<h2>Sources</h2><div class="card"><dl class="kv">${product}${revision}${r.sources.map(sourceRow).join('')}${planSourceRow()}</dl></div>`;
}

function overviewView() {
  const st = A.stats;
  return `<div class="page"><h1>${esc(P.title || 'Untitled plan')}</h1>${P.summary ? `<div class="md lead">${mdx(P.summary)}</div>` : ''}` +
    statsBlock(st) + coverageBar(st) + issuesBlock() + syntheticBlock() + upstreamBlock() + briefBlock() + changesBlock() + stylingBlock() + sourcesBlock() + '</div>';
}

// ───────── decisions ─────────

function cardClass(key) {
  return `${isSel(key) ? 'sel' : ''} ${nodeIsHl(key) ? 'hl' : ''}`;
}

function optionRow(o, chosen) {
  return `<tr class="${chosen ? 'chosen' : ''}"><td><b>${esc(o.name || o.id)}</b>${chosen ? ' ✓' : ''}${o.description ? `<div class="small muted">${inl(o.description)}</div>` : ''}</td><td>${bulletList(o.pros)}</td><td>${bulletList(o.cons)}</td></tr>`;
}

function optionsTable(d) {
  const opts = arr(d.options).map((o) => (typeof o === 'string' ? { name: o } : o));
  if (!opts.length) return '';
  const chosen = (o) => d.chosen != null && (String(d.chosen) === String(o.name) || String(d.chosen) === String(o.id));
  return `<table class="opts"><tr><th>Option</th><th>Pros</th><th>Cons</th></tr>${opts.map((o) => optionRow(o, chosen(o))).join('')}</table>`;
}

function decisionCard(d) {
  const key = d.__key;
  return `<div class="card ${cardClass(key)}" id="card-${esc(key)}"><div class="ch"><span class="kind">◆ Decision</span><b class="grow">${esc(d.title || d.id)}${commentMark(key)}</b>` +
    `${d.status ? `<span class="badge ${d.status === 'accepted' ? 'ok' : ''}">${esc(d.status)}</span>` : ''}<button class="ghost sm" data-act="sel-node" data-key="${esc(key)}">${inspectLabel()}</button></div>` +
    `${d.context ? `<div class="md">${mdx(d.context)}</div>` : ''}` + optionsTable(d) +
    `${d.rationale ? `<div class="md"><b>Rationale:</b> ${inl(d.rationale)}</div>` : ''}<div>${chips(d.satisfies)}</div></div>`;
}

function relatedChips(list) {
  return arr(list).map((x) => (A.reqById.has(x) || A.acById.has(x) ? refChip(x) : nodeChip(A.resolvePlanRef(x)) || `<code>${esc(x)}</code>`)).join('');
}

function answerRadios(q, ans) {
  const opts = arr(q.options);
  if (!opts.length) return '';
  return `<div class="radios">${opts.map((o) => `<label class="chk"><input type="radio" name="q-${esc(q.id)}" data-bind="answer:${esc(q.id)}" value="${esc(o)}" ${ans === String(o) ? 'checked' : ''}><span>${inl(o)}</span></label>`).join('')}</div>`;
}

function answerForm(q) {
  if (!isReview() || q.answer) return '';
  const ans = R.answers[q.id] || '';
  return `<div class="ans">${answerRadios(q, ans)}` +
    `<textarea class="box" id="ans-${esc(q.id)}" data-bind="answer:${esc(q.id)}" placeholder="Your answer…" style="margin-top:6px;min-height:46px">${arr(q.options).includes(ans) ? '' : esc(ans)}</textarea></div>`;
}

function questionCard(q) {
  const key = q.__key;
  return `<div class="card ${cardClass(key)}" id="card-${esc(key)}"><div class="ch"><span class="kind">? Question</span><code>${esc(q.id)}</code><b class="grow">${inl(q.question || '')}${commentMark(key)}</b>` +
    `${q.priority ? `<span class="badge ${severityClass(q.priority)}">${esc(q.priority)}</span>` : ''}</div>` +
    `${q.context ? `<div class="md muted">${mdx(q.context)}</div>` : ''}<div>${relatedChips(q.related)}</div>` +
    (q.answer ? `<div class="okmsg" style="margin-top:8px">Answer: ${inl(q.answer)}</div>` : '') + answerForm(q) + '</div>';
}

function riskRow(r) {
  return `<tr class="clk ${isSel(r.__key) ? 'on' : ''}" id="card-${esc(r.__key)}" data-act="sel-node" data-key="${esc(r.__key)}"><td><b>${inl(r.risk || r.title || r.id)}</b>${commentMark(r.__key)}</td><td>${esc([r.likelihood, r.impact].filter(Boolean).join(' / '))}</td><td>${inl(r.mitigation || '')}</td><td>${chips(r.satisfies)}${relatedChips(r.related)}</td></tr>`;
}

function listSection(title, list, render) {
  return list.length ? `<h2>${title}</h2>${list.map(render).join('')}` : '';
}

function risksBlock(rs) {
  if (!rs.length) return '';
  return `<h2>Risks</h2><table class="tbl"><tr><th>Risk</th><th>Likelihood / impact</th><th>Mitigation</th><th>Related</th></tr>${rs.map(riskRow).join('')}</table>`;
}

function decisionsView() {
  return `<div class="page">${listSection('Open questions', arr(P.open_questions), questionCard)}${listSection('Decisions', arr(P.decisions), decisionCard)}` +
    risksBlock(arr(P.risks)) + '</div>';
}

// ───────── delivery ─────────

const GWT_FIELDS = [['Given', 'given'], ['When', 'when'], ['Then', 'then']];
const IO_FIELDS = [['Input', 'input'], ['Output', 'expected_output']];

function hasSome(obj, fields) {
  return fields.some(([, f]) => obj[f]);
}

function labelledLines(obj, fields, gap) {
  return fields.map(([label, f]) => `<b>${label}</b>${gap}${inl(obj[f] || '')}`).join('<br>');
}

function reqsOfRefs(refs) {
  const out = new Set();
  for (const r of refs) { const b = baseReq(r); if (b) out.add(b.id); }
  return [...out];
}

function milestoneIncludes(m) {
  const includes = arr(m.includes);
  if (!includes.length) return '';
  return `<div class="small muted">Includes</div><div>${includes.map((x) => nodeChip(A.resolvePlanRef(x))).join('')}</div>`;
}

function milestoneCard(m, i) {
  const key = m.__key;
  const reqIds = reqsOfRefs(A.deepRefs.get(key) || new Set());
  return `<div class="card ${cardClass(key)}" id="card-${esc(key)}"><div class="ch"><span class="kind">⚑ ${i + 1}</span><b class="grow">${esc(m.title || m.id)}${commentMark(key)}</b>${m.target ? `<span class="badge">${esc(m.target)}</span>` : ''}` +
    `<button class="ghost sm" data-act="sel-node" data-key="${esc(key)}">${inspectLabel()}</button></div>${m.description ? `<div class="md">${mdx(m.description)}</div>` : ''}` +
    milestoneIncludes(m) +
    `<div class="small muted" style="margin-top:4px">Delivers ${reqIds.length} requirement(s)</div><div>${chips(reqIds)}</div></div>`;
}

function milestonesBlock(ms) {
  if (!ms.length) return '';
  return `<h2>Milestones</h2><div class="timeline">${ms.map(milestoneCard).join('')}</div>`;
}

function scenarioCell(v) {
  return hasSome(v, GWT_FIELDS) ? labelledLines(v, GWT_FIELDS, ' ') : inl(v.description || '');
}

function verificationRow(v) {
  return `<tr class="clk ${isSel(v.__key) ? 'on' : ''}" id="card-${esc(v.__key)}" data-act="sel-node" data-key="${esc(v.__key)}"><td><b>${esc(v.title || v.id)}</b>${commentMark(v.__key)}</td><td><span class="badge">${esc(v.type || 'test')}</span></td><td class="small">${scenarioCell(v)}</td><td>${chips(v.satisfies)}</td></tr>`;
}

function verificationBlock(vs) {
  if (!vs.length) return '';
  return `<h2>Verification</h2><table class="tbl"><tr><th>Check</th><th>Type</th><th>Scenario</th><th>Verifies</th></tr>${vs.map(verificationRow).join('')}</table>`;
}

function deliveryView() {
  return `<div class="page">${milestonesBlock(arr(P.milestones))}${verificationBlock(arr(P.verification))}</div>`;
}

// ───────── traceability ─────────

const PANEL_TRACE_FILTERS = [['all', 'All'], ['uncovered', 'Not covered'], ['partial', 'Partial'], ['covered', 'Covered'], ['deferred', 'Deferred'], ['out-of-scope', 'Out of scope'], ['synthetic', 'Synthetic']];

function traceCov(r) {
  return (A.coverage.get(r.id) || {}).status;
}

function traceFilterCount(id, reqs) {
  if (id === 'all') return reqs.length;
  if (id === 'synthetic') return A.synthetic.length;
  return reqs.filter((r) => traceCov(r) === id).length;
}

function traceFilters(reqs) {
  return PANEL_TRACE_FILTERS.map(([id, l]) => [id, l, traceFilterCount(id, reqs)]).filter(([id, , n]) => id === 'all' || n);
}

function traceInFilter(r) {
  const f = S.traceFilter;
  if (f === 'all') return true;
  return f === 'synthetic' ? r.synthetic : traceCov(r) === f;
}

function traceQueryMatch(r, q) {
  return !q || `${r.id} ${r.title} ${r.statement}`.toLowerCase().includes(q);
}

function segButton(act, id, label, on) {
  return `<button class="${on ? 'on' : ''}" data-act="${act}" data-id="${id}">${label}</button>`;
}

function traceBar(filters) {
  return `<div class="tbar"><span class="seg">${segButton('tview', 'list', 'List', S.traceView === 'list')}${segButton('tview', 'matrix', 'Matrix', S.traceView === 'matrix')}</span>` +
    `<span class="seg">${filters.map(([id, l, n]) => segButton('tfilter', id, `${l} ${n}`, S.traceFilter === id)).join('')}</span>` +
    `<input id="trace-q" data-bind="traceq" placeholder="Filter requirements…" value="${esc(S.traceQuery)}"></div>`;
}

function untracedBlock() {
  const untraced = A.untracedKeys;
  if (!untraced.length) return '';
  return `<h2>Plan items without a requirement</h2><div class="muted small">Possible scope creep, or a requirement that is missing upstream.</div><div style="margin-top:6px">${untraced.map(nodeChip).join('')}</div>`;
}

function traceView() {
  const reqs = A.allReqs;
  const q = S.traceQuery.toLowerCase();
  const list = reqs.filter((r) => traceInFilter(r) && traceQueryMatch(r, q));
  return `<div class="page wide"><h1>Traceability</h1><div class="muted">Every requirement and acceptance criterion, and the plan items that satisfy it. ● direct link · ◐ via an acceptance criterion.</div>${traceBar(traceFilters(reqs))}` +
    (S.traceView === 'matrix' ? traceMatrix(list) : traceList(list)) + untracedBlock() + '</div>';
}

function isReqSel(id) {
  return Boolean(S.sel && S.sel.type === 'req' && S.sel.id === id);
}

function traceCoverageCell(r, c) {
  return `<td>${covPill(c.status)}${r.acs.length ? `<div class="small muted">${c.acCovered}/${r.acs.length} ACs</div>` : ''}${c.reason ? `<div class="small muted">${esc(c.reason)}</div>` : ''}</td>`;
}

// Singular and plural nouns for the per-kind counts, in display order.
const COUNT_NOUNS = new Map([
  ['screen', ['screen', 'screens']], ['state', ['screen state', 'screen states']], ['element', ['element', 'elements']],
  ['interface', ['interface', 'interfaces']], ['flow', ['flow', 'flows']], ['flow-state', ['flow state', 'flow states']],
  ['transition', ['transition', 'transitions']], ['message', ['message', 'messages']], ['step', ['step', 'steps']],
  ['entity', ['entity', 'entities']], ['field', ['field', 'fields']], ['component', ['component', 'components']],
  ['decision', ['decision', 'decisions']], ['question', ['question', 'questions']], ['risk', ['risk', 'risks']],
  ['milestone', ['milestone', 'milestones']], ['verification', ['test', 'tests']], ['theme', ['theme', 'themes']],
]);

function kindOfKey(key) {
  const n = A.nodeByKey.get(key);
  return n && COUNT_NOUNS.has(n.kind) ? n.kind : 'other';
}

/** "1 screen · 4 elements · 1 flow": how many linked items of each kind. */
function kindCounts(keys) {
  const byKind = groupBy(keys, kindOfKey);
  return [...COUNT_NOUNS.keys(), 'other'].filter((k) => byKind.has(k)).map((k) => {
    const [one, many] = COUNT_NOUNS.get(k) || ['item', 'items'];
    const n = byKind.get(k).length;
    return `${n} ${n === 1 ? one : many}`;
  }).join(' · ');
}

// A row is open while its requirement is selected: counts first, every chip one click away.
function traceKeysCell(keys, open) {
  if (!keys.length) return '<td></td>';
  const counts = `<div class="tcount">${open ? '▾' : '▸'} ${esc(kindCounts(keys))}</div>`;
  return `<td>${counts}${open ? `<div class="tchips">${keys.map(nodeChip).join('')}</div>` : ''}</td>`;
}

function traceRow(r) {
  const c = A.coverage.get(r.id) || { acs: [], direct: [] };
  const keys = [...new Set([...c.direct, ...c.acs.flatMap((a) => a.keys)])];
  const open = isReqSel(r.id);
  return `<tr class="clk ${open ? 'on' : ''}" data-act="trace-row" data-id="${esc(r.id)}" aria-expanded="${open}"><td>${refChip(r.id)}${r.synthetic ? '<br><span class="badge syn">synthetic</span>' : ''}</td>` +
    `<td><div class="rt">${esc(r.title)}${commentMark('req:' + r.id)}</div><div class="rs">${esc(trunc(r.statement, 180))}</div></td><td>${strengthBadge(r)} <span class="small muted">${esc(typeLabel(r.type))}</span></td>` +
    traceCoverageCell(r, c) + traceKeysCell(keys, open) + '</tr>';
}

function traceList(list) {
  if (!list.length) return '<div class="empty">No requirements match.</div>';
  return `<div class="tblwrap"><table class="tbl"><tr><th>ID</th><th>Requirement</th><th>Kind</th><th>Coverage</th><th>Satisfied by</th></tr>${list.map(traceRow).join('')}</table></div>`;
}

function matrixMark(refs, r) {
  if (refs.has(r.id)) return 'd';
  return r.acs.some((a) => refs.has(a.id)) ? 'v' : '';
}

function matrixCell(r, c) {
  const mark = matrixMark(A.deepRefs.get(c.key) || new Set(), r);
  if (!mark) return '<td class=""></td>';
  return `<td class="${mark}" data-act="mxcell" data-key="${esc(c.key)}" data-id="${esc(r.id)}" title="${esc(r.id)} × ${esc(c.label)}">${mark === 'd' ? '●' : '◐'}</td>`;
}

function matrixHead(c) {
  return `<th class="vh" title="${esc(KIND[c.kind])}: ${esc(c.label)}"><div>${ICON[c.kind]} ${esc(trunc(c.label, 28))}</div></th>`;
}

function traceMatrix(list) {
  const cols = A.nodes.filter((n) => TOP_KINDS.has(n.kind) || n.kind === 'theme');
  if (!list.length || !cols.length) return '<div class="empty">Nothing to show.</div>';
  return `<div class="mxwrap" data-scroll="mx"><table class="mx"><thead><tr><th></th>${cols.map(matrixHead).join('')}</tr></thead><tbody>` +
    list.map((r) => `<tr><th>${refChip(r.id)} ${esc(trunc(r.title, 42))}</th>${cols.map((c) => matrixCell(r, c)).join('')}</tr>`).join('') + '</tbody></table></div>';
}

// ───────── review ─────────

function reviewCommentRow([t, c, i]) {
  return `<div class="cmt"><button class="del" data-act="del-comment" data-target="${esc(t)}" data-i="${i}" title="Delete">×</button><button class="linkish" data-act="reveal" data-key="${esc(t)}">${esc(targetLabel(t))}</button>\n${esc(c.text)}</div>`;
}

function reviewCommentsBlock() {
  const comments = Object.entries(R.comments).flatMap(([t, l]) => l.map((c, i) => [t, c, i]));
  const body = comments.length ? comments.map(reviewCommentRow).join('') : '<div class="muted">No comments yet. Select anything (a screen element, endpoint, transition, requirement…) and comment in the right panel.</div>';
  return `<h2>Comments (${comments.length})</h2>${body}`;
}

function reviewAnswersBlock() {
  const questions = arr(P.open_questions);
  const answered = questions.filter((q) => R.answers[q.id]);
  return `<h2>Answers (${answered.length}/${questions.length})</h2>${answered.map((q) => `<div class="cmt"><b>${esc(q.id)}</b> ${esc(q.question)}\n→ ${esc(R.answers[q.id])}</div>`).join('') || '<div class="muted">Answer open questions in the Decisions tab.</div>'}`;
}

function reviewView() {
  return `<div class="page"><h1>Review</h1><div class="muted">Comments and answers are saved in this browser. When you are done, hand them back to the agent: copy the feedback and paste it in chat, or download <code>review.json</code> next to the plan.</div>` +
    `<h2>Verdict</h2><div class="verdicts">${[['approve', '✓ Approve plan'], ['changes', '↻ Request changes'], ['reject', '✕ Reject']].map(([id, l]) => `<button class="vbtn ${id} ${R.verdict === id ? 'on' : ''}" data-act="verdict" data-id="${id}">${l}</button>`).join('')}</div>` +
    `<h2>Overall feedback</h2><textarea class="box" id="review-summary" data-bind="summary" placeholder="What should change? What is good?">${esc(R.summary)}</textarea>` +
    reviewCommentsBlock() + reviewAnswersBlock() +
    `<h2>Hand back to the agent</h2><div class="btnrow"><button class="primary" data-act="copy-review">Copy feedback for agent</button><button class="ghost" data-act="dl-review">Download review.json</button><button class="ghost" data-act="clear-review">Clear review</button></div></div>`;
}

// ───────── inspector ─────────

// Review mode: the comment box, first thing under the selected item's title.
function commentsBox(target, name) {
  if (!isReview()) return '';
  const list = R.comments[target] || [];
  return `<div class="isec"><div class="it">Comment on ${esc(name)}</div>${list.map((c, i) => `<div class="cmt"><button class="del" data-act="del-comment" data-target="${esc(target)}" data-i="${i}" title="Delete">×</button>${esc(c.text)}</div>`).join('')}` +
    `<textarea class="box" id="comment-box" data-bind="draft" data-target="${esc(target)}" placeholder="What should change here?">${esc(S.draft)}</textarea><div class="btnrow"><button class="primary" data-act="add-comment" data-target="${esc(target)}">Add comment (Ctrl+Enter)</button></div></div>`;
}

function acBlock(ac) {
  const s = ac.structured || {};
  let body = `<div class="stmt">${inl(ac.text || ac.title || '')}</div>`;
  if (hasSome(s, GWT_FIELDS)) body = `<div class="gwt">${labelledLines(s, GWT_FIELDS, '')}</div>`;
  else if (hasSome(s, IO_FIELDS)) body = `<div class="gwt">${labelledLines(s, IO_FIELDS, '')}</div>`;
  return `${ac.title && ac.text !== ac.title ? `<div class="rtl">${esc(ac.title)}</div>` : ''}${body}`;
}

function reqCard(id) {
  const req = A.reqById.get(id);
  const ac = A.acById.get(id);
  const base = baseReq(id);
  if (!base) return `<div class="rcard"><div class="rh">${refChip(id)}</div><div class="notr">Unknown reference — not in the requirement source</div></div>`;
  if (ac && !req) {
    return `<div class="rcard ${base.synthetic ? 'syn' : ''}"><div class="rh">${refChip(id)}<span class="kind">acceptance criterion of</span>${refChip(base.id)}</div>${acBlock(ac)}<div class="small muted" style="margin-top:4px">${esc(base.title)}</div></div>`;
  }
  return `<div class="rcard ${base.synthetic ? 'syn' : ''}"><div class="rh">${refChip(id)}${strengthBadge(base)}${base.synthetic ? '<span class="badge syn">synthetic</span>' : ''}</div><div class="rtl">${esc(base.title)}</div><div class="stmt">${inl(base.statement)}</div></div>`;
}

function inheritedRefs(n) {
  let p = n.parent && A.nodeByKey.get(n.parent);
  while (p) {
    if (p.satisfies.length) return p;
    p = p.parent && A.nodeByKey.get(p.parent);
  }
  return null;
}

const PANEL_NODE_FACTS = new Map([
  ['element', (o) => [['Type', o.type || 'text'], ...[['Navigates to', o.goto], ['Opens', o.opens], ['Feedback', o.toast]].filter((f) => f[1])]],
  ['transition', (o) => [['From', o.from], ['Event', o.on], ['Guard', o.guard], ['To', o.to]]],
  ['message', (o) => [['From', o.from], ['To', o.to], ['Message', o.label || o.message]]],
  ['field', (o) => [['Type', o.type], ['Required', o.required ? 'yes' : '']]],
  ['component', (o) => [['Kind', o.kind], ['Tech', o.tech]]],
  ['decision', (o) => [['Chosen', o.chosen], ['Status', o.status]]],
]);

function nodeHeader(n) {
  return `<div class="ih"><span class="kind">${ICON[n.kind] || ''} ${esc(KIND[n.kind] || n.kind)}</span></div><h3>${esc(nodeTitle(n))}</h3>`;
}

function nodeLinks(n, key, o) {
  const follow = o.goto ? `<button class="ghost sm" data-act="goto" data-id="${esc(o.goto)}">Follow link →</button>` : '';
  return `<div class="btnrow" style="margin-top:4px"><button class="ghost sm" data-act="reveal" data-key="${esc(key)}">Show in ${esc(n.view.tab)}</button>${follow}</div>`;
}

function nodeFactsBlock(n, o) {
  const factsOf = PANEL_NODE_FACTS.get(n.kind);
  const facts = factsOf ? factsOf(o) : [];
  return facts.some((f) => f[1]) ? `<div class="isec">${kvRows(facts)}</div>` : '';
}

function nodeBodyBlock(n, o) {
  if (n.kind === 'theme') return `<div class="isec">${themeFacts()}</div>`;
  const desc = [o.description, o.notes, o.summary, o.context].find(Boolean);
  return desc ? `<div class="isec md">${mdx(desc)}</div>` : '';
}

function nodeSatisfies(n) {
  if (n.satisfies.length) return n.satisfies.map(reqCard).join('');
  const inh = inheritedRefs(n);
  if (!inh) return '<div class="notr">Not traced to any requirement.</div>';
  return `<div class="small muted">No direct links; inherits from <button class="linkish" data-act="sel-node" data-key="${esc(inh.key)}">${esc(inh.label)}</button></div>${inh.satisfies.map(reqCard).join('')}`;
}

function nodeDeepBlock(n, key) {
  const deep = [...(A.deepRefs.get(key) || new Set())].filter((r) => !n.satisfies.includes(r));
  return deep.length ? `<div class="isec"><div class="it">Children also satisfy</div>${chips(deep)}</div>` : '';
}

function nodeChangeBlock(key) {
  const c = changeOf(key);
  const code = codeRefs(key);
  if (!c && !code) return '';
  return `<div class="isec">${c ? `<span class="chg ${c}">${CHANGE_LABEL[c]}</span> ` : ''}${code}</div>`;
}

function nodeInspector(key) {
  const n = A.nodeByKey.get(key);
  if (!n) return '<div class="help">Item not found.</div>';
  const o = n.obj || {};
  return nodeHeader(n) + commentsBox(key, n.label || nodeTitle(n)) + nodeLinks(n, key, o) + nodeFactsBlock(n, o) + nodeChangeBlock(key) + nodeBodyBlock(n, o) +
    `<div class="isec"><div class="it">Satisfies</div>${nodeSatisfies(n)}</div>` + nodeDeepBlock(n, key);
}

function mdSection(title, text) {
  return text ? `<div class="isec"><div class="it">${title}</div><div class="md">${mdx(text)}</div></div>` : '';
}

function reqHeader(r) {
  return `<div class="ih">${refChip(r.id)}${strengthBadge(r)}<span class="badge">${esc(typeLabel(r.type))}</span>${r.status ? `<span class="badge">${esc(r.status)}</span>` : ''}${r.synthetic ? '<span class="badge syn">synthetic</span>' : ''}</div>` +
    `<h3>${esc(r.title)}</h3><div class="stmt" style="font-size:14px;color:var(--ink)">${inl(r.statement)}</div>`;
}

function reqCoverageRow(r, c, acId) {
  const target = acId || r.id;
  return `<div class="btnrow">${covPill(c.status)}${c.reason ? `<span class="small muted">${esc(c.reason)}</span>` : ''}<button class="ghost sm" data-act="highlight" data-id="${esc(target)}">${S.hlReq === target ? 'Clear highlight' : 'Highlight everywhere'}</button></div>`;
}

function acRow(ac, c, acId) {
  const keys = (c.acs.find((a) => a.id === ac.id) || { keys: [] }).keys;
  return `<div class="acrow ${acId === ac.id ? 'focus' : ''}"><div class="rh">${refChip(ac.id)}</div>${acBlock(ac)}<div style="margin-top:4px">${keys.length ? keys.map(nodeChip).join('') : '<span class="notr">not traced</span>'}</div></div>`;
}

// Collapsible inspector section. Open state is remembered across selections in S.inspOpen.
function foldSection(id, title, body) {
  const open = Boolean(S.inspOpen && S.inspOpen[id]);
  return `<div class="isec fold"><button class="it foldh" data-act="fold" data-id="${id}" aria-expanded="${open}">${open ? '▾' : '▸'} ${title}</button>${open ? body : ''}</div>`;
}

function reqAcsBlock(r, c, acId) {
  const body = r.acs.length ? r.acs.map((ac) => acRow(ac, c, acId)).join('') : '<div class="faint small">none</div>';
  return foldSection('acs', `Acceptance criteria (${c.acCovered || 0}/${r.acs.length} traced)`, body);
}

function reqLinksBlock(c) {
  const viaAcs = [...new Set(c.acs.flatMap((a) => a.keys))].filter((k) => !c.direct.includes(k));
  const direct = `<div class="small muted">Directly</div>${c.direct.length ? c.direct.map(nodeChip).join('') : '<span class="faint small">no direct links</span>'}`;
  const via = viaAcs.length ? `<div class="small muted" style="margin-top:6px">Via acceptance criteria</div>${viaAcs.map(nodeChip).join('')}` : '';
  const total = c.direct.length + viaAcs.length;
  return foldSection('links', `Satisfied by (${total})`, direct + via);
}

function reqRelatedBlock(r) {
  const related = [
    r.parent ? `parent ${refChip(r.parent)}` : '',
    r.children.length ? ` children ${chips(r.children)}` : '',
    r.dependencies.length ? ` depends on ${chips(r.dependencies)}` : '',
  ].join('');
  return related ? `<div class="isec"><div class="it">Related requirements</div>${related}</div>` : '';
}

function reqUpstreamCard([k, o]) {
  return `<div class="rcard"><span class="kind">${k}</span> <code>${esc(o.id)}</code> ${o.status ? `<span class="badge">${esc(o.status)}</span>` : ''}<div class="stmt">${inl(o.text)}</div></div>`;
}

function reqQuestionsBlock(r) {
  const upstream = upstreamItems().filter(([, o]) => arr(o.related).includes(r.id));
  const planQs = arr(P.open_questions).filter((q) => arr(q.related).includes(r.id));
  if (!upstream.length && !planQs.length) return '';
  return `<div class="isec"><div class="it">Questions & context</div>${upstream.map(reqUpstreamCard).join('')}${planQs.map((q) => nodeChip(q.__key)).join('')}</div>`;
}

function testEntry(key) {
  const v = A.nodeByKey.get(key).obj;
  return `<div class="acrow clk" data-act="sel-node" data-key="${esc(key)}"><div class="rh"><b>${esc(v.title || v.id)}</b> <span class="badge">${esc(v.type || 'test')}</span></div><div class="small">${scenarioCell(v)}</div></div>`;
}

function reqTestBlock(r) {
  const tests = A.testsByReq.get(r.id) || [];
  const note = r.verification ? `<div class="md">${mdx(r.verification)}</div>` : '';
  const body = note || tests.length ? note + tests.map(testEntry).join('') : '<span class="notr">nothing yet</span> <span class="faint small">add a verification note or a verification entry</span>';
  return `<div class="isec"><div class="it">How to test it</div>${body}</div>`;
}

function reqInspector(id, acId) {
  const r = A.reqById.get(id);
  if (!r) return `<div class="help">Unknown requirement <code>${esc(id)}</code>.</div>`;
  const c = A.coverage.get(r.id) || { direct: [], acs: [] };
  return reqHeader(r) + commentsBox('req:' + r.id, r.id) + reqCoverageRow(r, c, acId) + reqTestBlock(r) + mdSection('Rationale', r.rationale) +
    reqAcsBlock(r, c, acId) + reqLinksBlock(c) + reqRelatedBlock(r) + reqQuestionsBlock(r);
}

function inspectorHelp() {
  const comment = isReview() ? ' and comment on it' : '';
  const proto = arr(P.screens).length ? `In the prototype, press <kbd>X</kbd> (Inspect) or Alt+click an element to inspect it${isReview() ? ' and comment' : ''} instead of clicking through. ` : '';
  return `<h3>Inspector</h3><div class="help"><p>Select anything to see <b>which requirements it satisfies</b>${comment}, or select a requirement to see <b>everything that implements it</b>.</p>` +
    `<p>${proto}<kbd>Esc</kbd> clears the selection.</p></div>` +
    `<div class="legend"><div>${covPill('covered')} every AC traced (or no ACs)</div><div>${covPill('partial')} some ACs traced</div><div>${covPill('uncovered')} nothing in the plan satisfies it</div><div>${covPill('deferred')} explicitly excluded from this plan</div><div><span class="chip ref syn">SYN-1</span> synthetic requirement proposed by the plan</div><div><span class="chip ref ac">AC-1</span> acceptance criterion</div></div>` +
    (isReview() ? `<div style="margin-top:20px">${commentsBox('plan', 'the whole plan')}</div>` : '');
}

function inspector() {
  let body;
  if (S.sel && S.sel.type === 'node') body = nodeInspector(S.sel.key);
  else if (S.sel && S.sel.type === 'req') body = reqInspector(S.sel.id, S.sel.ac);
  else body = inspectorHelp();
  return `<aside class="insp" data-scroll="insp">${body}</aside>`;
}

<script>/* viewer-app.js */
/* reqplan viewer - app shell: setup, header, render loop, routing, events, drag & drop loader. */
'use strict';

const TAB_RULES = [
  ['overview', 'Overview', () => true],
  ['prototype', 'Prototype', () => arr(P.screens).length],
  ['system', 'System', () => systemSubs().length],
  ['decisions', 'Decisions', () => hasAnyItems(P.decisions, P.open_questions, P.risks)],
  ['delivery', 'Delivery', () => hasAnyItems(P.milestones, P.verification)],
  ['trace', 'Traceability', () => true],
  ['review', 'Review', () => isReview()],
];

function hasAnyItems(...lists) {
  return lists.some((l) => arr(l).length);
}

function tabsList() {
  return TAB_RULES.filter((rule) => rule[2]()).map(([id, label]) => [id, label]);
}

function header() {
  const st = A.stats;
  const r = A.reqs;
  const src = r.product
    ? `${esc(r.product.name)}${r.revision ? ` · rev ${esc(r.revision.version || r.revision.id)}` : ''}`
    : esc((r.sources[0] || {}).label || (A.synthetic.length ? 'synthetic requirements' : 'no requirements loaded'));
  const nC = countComments();
  const qOpen = arr(P.open_questions).filter((q) => !q.answer && !R.answers[q.id]).length;
  return `<header class="top"><div class="brand"><div class="logo">◧</div><div><div class="ttl">${esc(P.title || 'Untitled plan')}</div>` +
    `<div class="sub">${src} · <span class="mode ${isReview() ? 'rv' : 'pt'}">${isReview() ? 'Review draft' : 'Agreed prototype'}</span></div></div></div>` +
    `<nav class="tabs">${tabsList().map(([id, label]) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}">${label}` +
      (id === 'review' && nC ? ` <span class="cnt">${nC}</span>` : '') +
      (id === 'decisions' && qOpen && isReview() ? ` <span class="cnt">${qOpen}</span>` : '') +
      (id === 'trace' && st.uncovered ? ` <span class="cnt bad">${st.uncovered}</span>` : '') + '</button>').join('')}</nav>` +
    `<div class="hact"><button class="cov" data-act="tab" data-id="trace" title="In-scope requirement coverage">${covRing(st.coveragePct)}<span>${st.coveragePct}%</span></button>` +
    `${S.hlReq ? `<button class="ghost sm" data-act="highlight" data-id="${esc(S.hlReq)}" title="Clear highlight">✕ ${esc(S.hlReq)}</button>` : ''}` +
    `<button class="xraybtn ${S.xray ? 'on' : ''}" data-act="xray" title="${isReview() ? 'Inspect and comment (X)' : 'Inspect (X)'}">Inspect</button></div></header>`;
}

function mainView() {
  switch (S.tab) {
    case 'prototype': return prototypeView();
    case 'system': return systemView();
    case 'decisions': return decisionsView();
    case 'delivery': return deliveryView();
    case 'trace': return traceView();
    case 'review': return isReview() ? reviewView() : overviewView();
    default: return overviewView();
  }
}

function render() {
  if (!A) return;
  const scrolls = saveScrolls();
  const focus = captureFocus();
  if (!tabsList().some((t) => t[0] === S.tab)) S.tab = 'overview';
  app().innerHTML = header() + `<div class="body"><main data-scroll="main-${S.tab}">${mainView()}</main>${inspector()}</div>` + toastBar();
  restoreScrolls(scrolls);
  restoreFocus(focus);
  scrollToTarget();
  writeHash();
}

function toastBar() {
  return S.toast ? `<div class="toast ${esc(S.toast.tone)}">${esc(S.toast.text)}</div>` : '';
}

function saveScrolls() {
  const scrolls = {};
  app().querySelectorAll('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  return scrolls;
}

function restoreScrolls(scrolls) {
  app().querySelectorAll('[data-scroll]').forEach((el) => {
    const s = scrolls[el.dataset.scroll];
    if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1]; }
  });
}

function captureFocus() {
  const ae = document.activeElement;
  return { id: ae && ae.id, caret: caretOf(ae) };
}

function caretOf(el) {
  try { return el && el.selectionStart; } catch (e) { return null; }
}

function restoreFocus(focus) {
  const el = focus.id && document.getElementById(focus.id);
  if (!el) return;
  el.focus();
  try { if (focus.caret != null) el.setSelectionRange(focus.caret, focus.caret); } catch (e) { /* not a text input */ }
}

function scrollToTarget() {
  if (!S.scrollTo) return;
  const el = document.getElementById(S.scrollTo) || document.querySelector(`[data-key="${CSS.escape(S.scrollTo)}"]`);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  S.scrollTo = null;
}

const app = () => document.getElementById('app');

// ───────── routing ─────────

// Hash routes: tab[/screen#state] or tab[/sub[/selection]], then ?req=<id> for a selected requirement.
const ROUTES = new Map(Object.entries({
  prototype: {
    write: () => '/' + encodeURIComponent(S.screen || '') + (S.screenState ? '#' + encodeURIComponent(S.screenState) : ''),
    read: (parts) => { const [sid, st] = parts[1].split('#'); S.screen = sid; S.screenState = st || null; },
  },
  system: {
    write: () => '/' + S.sub + (S.sysSel[S.sub] != null ? '/' + encodeURIComponent(S.sysSel[S.sub]) : ''),
    read: (parts) => { S.sub = parts[1]; if (parts[2]) S.sysSel[parts[1]] = parts.slice(2).join('/'); },
  },
}));

function writeHash() {
  const route = ROUTES.get(S.tab);
  const h = S.tab + (route ? route.write() : '') + reqQuery();
  try { history.replaceState(null, '', '#' + h); } catch (e) { /* file:// in some browsers */ }
}

function reqQuery() {
  return S.sel && S.sel.type === 'req' ? '?req=' + encodeURIComponent(S.sel.ac || S.sel.id) : '';
}

function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!raw) return;
  const [path, query] = raw.split('?');
  const parts = path.split('/');
  if (parts[0]) S.tab = parts[0];
  const route = ROUTES.get(S.tab);
  if (route && parts[1]) route.read(parts);
  const m = /req=(.+)/.exec(query || '');
  if (m) selectReq(m[1]);
}

// ───────── selection & reveal ─────────

function selectReq(id) {
  const ac = A.acById.get(id);
  S.sel = ac && !A.reqById.has(id) ? { type: 'req', id: ac.req, ac: id } : { type: 'req', id };
  if (S.sel.ac) S.inspOpen = { ...S.inspOpen, acs: true };
  S.draft = '';
}

// Traceability list: clicking a row opens (selects) it; clicking the open row closes it.
function toggleTraceRow(id) {
  if (isReqSel(id)) S.sel = null;
  else selectReq(id);
}

function toggleFold(id) {
  S.inspOpen = { ...S.inspOpen, [id]: !(S.inspOpen && S.inspOpen[id]) };
}

function selectNode(key) {
  S.sel = { type: 'node', key };
  S.draft = '';
}

function reveal(key) {
  if (!key) return;
  if (key.startsWith('req:')) { selectReq(key.slice(4)); return; }
  if (key === 'plan') { S.sel = null; return; }
  const n = A.nodeByKey.get(key);
  if (!n) return;
  S.tab = n.view.tab;
  if (n.view.tab === 'prototype') showProtoView(n.view);
  else if (n.view.tab === 'system') { S.sub = n.view.sub; S.sysSel[n.view.sub] = n.view.id; }
  selectNode(key);
  S.scrollTo = scrollTargetOf(n, key);
}

function showProtoView(v) {
  if (v.theme) return; // Theme applies to every screen; keep the current one.
  const s = screenById(v.screen);
  if (s && s.modal) { showModalScreen(s); return; }
  S.screen = v.screen;
  S.screenState = v.state || null;
  S.modal = null;
}

function showModalScreen(s) {
  const opener = A.nodes.find((x) => x.kind === 'element' && String(x.obj.opens || '').split('#')[0] === s.id);
  if (opener) { S.screen = opener.view.screen; S.screenState = opener.view.state || null; }
  S.modal = s.id;
}

function scrollTargetOf(n, key) {
  if (n.kind === 'element') return key;
  if (n.kind === 'field') return 'card-' + n.parent;
  return 'card-' + (n.parent && !TOP_KINDS.has(n.kind) ? n.parent : key);
}

// ───────── events ─────────

// Click handlers by data-act. Each gets (dataset, event, target); returning false skips the re-render.
const CLICK_ACTIONS = new Map(Object.entries({
  noop: () => false,
  tab: (d) => { S.tab = d.id; },
  sub: (d) => { S.sub = d.id; },
  xray: () => { toggleXray(); },
  changes: () => { toggleChanges(); },
  chgfilter: (d) => { S.changeFilter = d.id; },
  goto: (d, ev) => { ev.preventDefault(); navigate(d.id); },
  open: (d) => { S.modal = d.id; S.tab = 'prototype'; },
  back: () => { goBack(); },
  state: (d) => { S.screenState = d.id || null; },
  'close-modal': () => { S.modal = null; },
  'modal-bg': (d, ev, t) => closeModalBackdrop(ev, t),
  el: (d, ev) => clickElement(d.key, ev),
  row: (d, ev) => { clickRow(d.key, ev); },
  item: (d, ev) => { clickItem(d, ev); },
  ptab: (d) => { S.tabsel[d.key] = +d.i; },
  syssel: (d) => { S.sysSel[d.sub] = d.id; },
  'sel-node': (d) => { selectNode(d.key); },
  'sel-req': (d, ev) => { ev.stopPropagation(); selectReq(d.id); },
  'trace-row': (d) => { toggleTraceRow(d.id); },
  fold: (d) => { toggleFold(d.id); },
  reveal: (d) => { reveal(d.key); },
  highlight: (d) => { toggleHighlight(d.id); },
  mxcell: (d) => { S.hlReq = d.id; reveal(d.key); },
  tview: (d) => { S.traceView = d.id; },
  tfilter: (d) => { S.traceFilter = d.id; },
  sim: (d) => { simulate(d); },
  fire: (d) => fireTransition(d.key, +d.i),
  'add-comment': (d) => { addComment(d.target); },
  'del-comment': (d) => { deleteComment(d.target, +d.i); },
  verdict: (d) => { R.verdict = R.verdict === d.id ? null : d.id; saveReview(); },
  'copy-review': () => copyReview(),
  'dl-review': () => { downloadReview(); },
  'clear-review': () => { clearReview(); },
}));

function onClick(ev) {
  const t = ev.target.closest('[data-act]');
  if (!t || !A) return;
  const handler = CLICK_ACTIONS.get(t.dataset.act);
  if (handler && handler(t.dataset, ev, t) !== false) render();
}

const inspecting = (ev) => S.xray || ev.altKey;
const CLICK_FIELD_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT']);

function toggleXray() {
  S.xray = !S.xray;
}

// Existing-project mode: outline what the change adds, changes and removes in the prototype.
function toggleChanges() {
  if (A.changes.used) S.changeView = !S.changeView;
}

function goBack() {
  const prev = S.history.pop();
  if (!prev) return;
  S.screen = prev[0];
  S.screenState = prev[1];
  S.modal = null;
}

function closeModalBackdrop(ev, t) {
  if (ev.target !== t) return false;
  S.modal = null;
  return true;
}

function clickElement(key, ev) {
  const n = A.nodeByKey.get(key);
  if (!n) return false;
  if (inspecting(ev)) { ev.preventDefault(); selectNode(key); return true; }
  if (CLICK_FIELD_TAGS.has(ev.target.tagName) || !isActionable(n.obj)) return false;
  ev.preventDefault();
  elAction(n.obj);
  return true;
}

function clickRow(key, ev) {
  const n = A.nodeByKey.get(key);
  if (inspecting(ev)) selectNode(key); else if (n) navigate(n.obj.row_goto);
}

function clickItem(d, ev) {
  if (inspecting(ev) || !d.goto) selectNode(d.key); else navigate(d.goto);
}

function toggleHighlight(id) {
  S.hlReq = S.hlReq === id ? null : id;
  if (!S.hlReq || S.tab !== 'overview') return;
  if (arr(P.screens).length) S.tab = 'prototype';
}

function simState(key) {
  return S.sim[key] || (S.sim[key] = {});
}

function simulate(d) {
  const sim = simState(d.key);
  if (d.k === 'reset') S.sim[d.key] = {};
  else if (d.k === 'sent' || d.k.startsWith('ex')) sim[d.k] = !sim[d.k];
  else if (d.k === 'i') sim.i = Number(d.v);
  else if (d.k === 'cur') sim.cur = d.v || null;
  else sim[d.k] = d.v;
}

function fireTransition(key, i) {
  const n = A.nodeByKey.get(key);
  const f = n && n.obj;
  const tr = f && arr(f.transitions)[i];
  if (!tr) return false;
  const sim = simState(key);
  const initial = f.initial || RC.stateIdOf(arr(f.states)[0], 0);
  sim.trail = (sim.trail || [initial]).concat(tr.to);
  sim.cur = tr.to;
  selectNode(`${key}/t${i + 1}`);
  return true;
}

function addComment(target) {
  const text = (S.draft || '').trim();
  if (!text) { toast('Write a comment first', 'bad'); return; }
  (R.comments[target] = R.comments[target] || []).push({ text, at: new Date().toISOString() });
  S.draft = '';
  saveReview();
  toast('Comment saved', 'ok');
}

function deleteComment(target, i) {
  const l = R.comments[target] || [];
  l.splice(i, 1);
  if (!l.length) delete R.comments[target];
  saveReview();
}

function copyReview() {
  copyText(reviewMarkdown(buildReview())).then((ok) => { toast(ok ? 'Feedback copied — paste it into your agent chat' : 'Copy failed — use Download instead', ok ? 'ok' : 'bad'); render(); });
  return false;
}

function downloadReview() {
  const base = (D.plan_file || P.title || 'plan').replace(/^.*[\\/]/, '').replace(/\.json$/i, '').replace(/\.plan$/i, '');
  download(`${base}.review.json`, JSON.stringify(buildReview(), null, 2));
}

function clearReview() {
  if (!confirm('Clear all comments, answers and the verdict?')) return;
  R = { verdict: null, summary: '', comments: {}, answers: {} };
  saveReview();
}

// Input handlers by data-bind: "name:" binds take the rest of the bind as their key, the others must match exactly.
const INPUT_BINDS = new Map(Object.entries({
  'form:': (val, key) => { S.form[key] = val; },
  draft: (val) => { S.draft = val; },
  summary: (val) => { R.summary = val; saveReview(); },
  'answer:': (val, key, el) => { R.answers[key] = val; saveReview(); if (el.type === 'radio') render(); },
  traceq: (val) => { S.traceQuery = val; render(); },
}));

function onInput(ev) {
  const el = ev.target;
  const b = el.dataset && el.dataset.bind;
  if (!b || !A) return;
  const i = b.indexOf(':');
  const handler = INPUT_BINDS.get(i < 0 ? b : b.slice(0, i + 1));
  if (handler) handler(el.type === 'checkbox' ? el.checked : el.value, b.slice(i + 1), el);
}

const KEY_FIELD_TAGS = new Set(['input', 'textarea', 'select']);
const KEY_ACTIONS = new Map([['x', toggleXray], ['X', toggleXray], ['c', toggleChanges], ['C', toggleChanges], ['Escape', dismissTop]]);

function onKey(ev) {
  if (KEY_FIELD_TAGS.has((ev.target.tagName || '').toLowerCase())) { fieldKey(ev); return; }
  const action = A && KEY_ACTIONS.get(ev.key);
  if (!action) return;
  action();
  render();
}

function fieldKey(ev) {
  if (ev.key === 'Escape') ev.target.blur();
  else if (isCommentSubmit(ev)) { ev.preventDefault(); addComment(ev.target.dataset.target); render(); }
}

const isCommentSubmit = (ev) => ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey) && ev.target.id === 'comment-box' && !!A;

function dismissTop() {
  if (S.modal) S.modal = null; else if (S.sel) S.sel = null; else S.hlReq = null;
}

const firesOnChange = (el) => el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT';

// ───────── setup & loader ─────────

function readEmbedded() {
  const el = document.getElementById('reqplan-data');
  const txt = el ? el.textContent.trim() : '';
  if (!txt || txt.startsWith('__REQPLAN')) return null;
  try { return JSON.parse(txt); } catch (e) { console.error('reqplan: bad embedded data', e); return null; }
}

function setup(data) {
  D = data;
  P = D.plan || {};
  A = RC.analyze(P, requirementsInput());
  document.title = `${P.title || 'Plan'} · reqplan`;
  refRegex = buildRefRegex();
  reviewKey = `reqplan:${P.title || ''}:${D.built_at || ''}`;
  loadReview();
  applyStart();
  readHash();
  render();
}

function requirementsInput() {
  if (D.requirements) return D.requirements;
  return P.requirements && typeof P.requirements === 'object' ? P.requirements : null;
}

function buildRefRegex() {
  const ids = [...A.reqById.keys(), ...A.acById.keys()].filter(Boolean).sort((a, b) => b.length - a.length).map(reEsc);
  return ids.length ? new RegExp(`(?<![\\w-])(${ids.join('|')})(?![\\w-])`, 'g') : null;
}

function applyStart() {
  const start = P.start ? String(P.start).split('#') : [];
  S.screen = start[0] || firstPageId();
  S.screenState = start[1] || null;
}

function firstPageId() {
  const page = arr(P.screens).find((s) => !s.modal);
  return (page && page.id) || null;
}

// Dropped files: the first matching rule names the kind; anything else is a plan.
const hasAnyKey = (json, keys) => keys.some((k) => json[k]);
const FILE_KIND_RULES = [
  ['requirements', (json) => hasAnyKey(json, ['export_version', 'active_revision'])],
  ['requirements', (json) => json.data && json.data.requirements],
  ['plan', (json) => hasAnyKey(json, ['screens', 'interfaces', 'api', 'flows', 'entities', 'synthetic_requirements', 'scope'])],
  ['requirements', (json) => json.requirements],
];

function classify(json) {
  const rule = json ? FILE_KIND_RULES.find(([, test]) => test(json)) : null;
  return rule ? rule[0] : 'plan';
}

async function parseDropped(files) {
  const jsons = [];
  for (const f of files) {
    try { jsons.push(JSON.parse(await f.text())); } catch (e) { alert(`${f.name}: not valid JSON (${e.message})`); return null; }
  }
  return jsons;
}

function droppedRequirements(reqs) {
  if (!reqs.length) return null;
  return reqs.length === 1 ? reqs[0] : reqs;
}

async function loadDropped(files) {
  const jsons = await parseDropped(files);
  if (!jsons) return;
  const isReqs = (json) => classify(json) === 'requirements';
  const plan = jsons.filter((json) => !isReqs(json)).pop();
  if (!plan) { alert('No plan file found among the dropped files.'); return; }
  setup({ plan, requirements: droppedRequirements(jsons.filter(isReqs)), mode: 'review', built_at: '', plan_file: files[0].name });
}

function dropZone() {
  app().innerHTML = `<div class="drop" id="drop"><div class="logo" style="margin:0 auto 12px;width:44px;height:44px;font-size:22px">◧</div><h1>reqplan viewer</h1>` +
    `<p class="muted">Drop a <b>plan.json</b> and (optionally) a <b>requirements file</b> — a product-oracle baseline export or a synthetic requirements JSON — anywhere on this page.</p>` +
    `<p><input type="file" id="files" multiple accept=".json,application/json"></p><p class="small faint">Nothing is uploaded: files are read locally in your browser.</p></div>`;
  document.getElementById('files').addEventListener('change', (e) => loadDropped([...e.target.files]));
  const dz = document.getElementById('drop');
  document.addEventListener('dragover', (e) => { e.preventDefault(); dz && dz.classList.add('over'); });
  document.addEventListener('dragleave', () => dz && dz.classList.remove('over'));
  document.addEventListener('drop', (e) => { e.preventDefault(); if (!A) loadDropped([...e.dataTransfer.files]); });
}

document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', (ev) => { if (firesOnChange(ev.target)) onInput(ev); });
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => { if (A) { readHash(); render(); } });

(function init() {
  const data = readEmbedded();
  if (data && data.plan) setup(data); else dropZone();
})();

</script>

      .forEach(function (f) { document.write('<script src="' + f + '"><\/script>'); });

</script>
