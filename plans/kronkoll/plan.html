<script id="reqplan-data" type="application/json">{"generator":"reqplan 0.1.0","mode":"review","built_at":"2026-11-04T08:47:42.806Z","plan_file":"plan.json","plan":{"$schema":"https://github.com/system-verification/reqplan/skills/reqplan/schema/plan.schema.json","title":"Kronkoll – personlig budgetapp (plan v3)","summary":"**Kronkoll** är en privat, gratis och säker budgetapp för Johan. Den hämtar transaktioner från Skandia via Enable Banking (endast läsbehörighet), kategoriserar dem med regler som lär sig, och visar budget, sparmål och hur föräldraledighet påverkar inkomsten. Allt körs på Cloudflare free tier (Pages + Worker + D1 + Access) och deployas från GitHub Actions bakom hårda kvalitetsgrindar.\n\n**Så läser du planen**\n- **Prototyp** (mobil): Översikt → Transaktioner → Budget → Sparmål → Inkomst, plus koppla bank, CSV-import, inställningar och radering.\n- **Flöden**: dataflödet *bank → databas → kategori → budget* (`F-dataflode`), koppla bank/koppla om, samtyckets och transaktionens livscykel, regelinlärning och omräkning vid föräldraledighet.\n- **Data & arkitektur**: ports & adapters – `domain` är ren TypeScript; Enable Banking, CSV, D1, Web Push och Access ligger i adaptrar.\n- **Risker**: risker `R-*` och en kort **hotmodell enligt STRIDE** (`T-*`).\n- **Verifiering**: varje krav och AC är kopplat till unit-, integrations-, kontrakts-, E2E- eller manuella tester – se spårbarhetsmatrisen.\n- **Etapper**: M0 fundament + spike, **M1 = MVP**, M2 sparmål & inkomst, M3 insikter & notiser. Hushåll med flera användare ingår inte (KK-28).\n\n**v2 (granskning godkänd 2026-11-01):** publikt repo, 2 synkar/dygn, preliminära räknas i budget, transaktioner sparas tills du raderar, ingen överföring av budgetrest, mutationströskel 85 %. Sparmål och ledighet ligger kvar i M2. Skandia är sett på Enable Bankings webbplats; kortet och villkoren verifieras i spiken. **v3:** KK-29–KK-35 (tidigare SYN-1–SYN-7) är nu ordinarie krav. Branch protection och CI-grinden finns i repot (D-branch). Se de accepterade besluten D-branch, D-repo, D-sync, D-pending, D-retention, D-rollover och D-mutation.\n\n> **Notera:** American Express går inte att koppla i Sverige. Amex-kort hanteras med CSV-import (KK-6-B, KK-10).\n\n### Antaganden (A-1 … A-11)\nAllt nedan är **antaget av agenten** och ska verifieras – främst i spiken i M0.\n1. **A-1** ✅ *Verifierat 2026-11-01.* Enable Banking *Restricted Production* är tillåtet för privat bruk med egna, länkade konton, och villkoren nämner ingen kostnad. Antalet länkade konton kan begränsas (ingen siffra anges). Bara konton som tillhör den som länkade dem får läsas, vilket passar eftersom Kronkoll har en användare (KK-28).\n2. **A-2** Skandia finns som ASPSP i SE med AIS. ✅ *Verifierat 2026-11-01:* ASPSP-namnet är `Skandia` (personal och business), längsta samtycke är 180 dagar och Visa-kortet kommer som eget konto. Historikdjup vid första samtycket och preliminära (PDNG) är fortfarande okänt (ofta 13–24 mån, därefter ~90 dagar per hämtning) och verifieras när adaptern (#24) körs i produktion.\n3. **A-3** Cloudflare free-gränser (nov 2026): Workers 100 000 anrop/dygn och 10 ms CPU per anrop, 5 Cron Triggers per konto, D1 5 GB lagring, 5 M lästa rader/dygn, 100 000 skrivna rader/dygn och Time Travel 7 dagar, Access gratis upp till 50 användare. Verifiera mot aktuella villkor. *Verifierat 2026-11-01:* Zero Trust free kräver ett registrerat betalkort, även om planen kostar 0 kr.\n4. **A-4** ✅ *Verifierat 2026-11-01.* Cloudflare Access skyddar produktionsvärden `kronkoll-25e.pages.dev` som en self-hosted application. Projektet heter `kronkoll`; adressen fick tillägget `-25e` eftersom `kronkoll.pages.dev` var upptaget. Två Access-applikationer behövs: en för `kronkoll-25e.pages.dev` och en för `*.kronkoll-25e.pages.dev` (förhandsversioner och adresser per deploy). Båda använder policyn *Endast Johan*. En icke inbjuden e-post nekas, och deployens rökprov visar att `/` och `/api/health` omdirigeras till Access-inloggningen.\n5. **A-5** Föräldrapenning ≈ 80 % av SGI × 0,97 / 365 per dag, tak 10 prisbasbelopp. Prisbasbelopp 2026 = 59 200 kr. Lagras som årsparametrar, aldrig hårdkodat.\n6. **A-6** Utbetalningar från Försäkringskassan syns med motpart som innehåller \"FORSAKRINGSKASSAN\"/\"FÖRSÄKRINGSKASSAN\".\n7. **A-7** iOS ≥ 16.4 och Android stöder Web Push för installerad PWA.\n8. **A-8** GitHub secret scanning och push protection är gratis för publika repon men inte för privata (där kräver de GitHub Advanced Security). gitleaks i CI är gratis i båda fallen.\n9. **A-9** Skattesatsen för nettouppskattning anges av användaren (från lönebeskedet) och beräknas inte från skattetabeller.\n10. **A-10** All exempeldata i prototypen är påhittad.\n11. **A-11** Tröskelvärdena (14 dagars banner, 10 dagar för försvunna preliminära, 15 min manuell synk, avvikelse 30 %/500 kr, cache 24 h, push 14/3/0) är bekräftade som startvärden och kan konfigureras.","requirements":"./requirements.json","prototype":{"app_name":"Kronkoll","device":"mobile"},"theme":{"preset":"light","tokens":{"background":"#F5F6F8","surface":"#FFFFFF","input":"#FFFFFF","text":"#1A2230","heading":"#0B1220","muted":"#566070","border":"#E3E6EB","primary":"#0F6B63","success":"#157F3D","warning":"#A15C07","danger":"#B42323","info":"#1F4FBF","radius":"16px","button_radius":"999px","font":"Inter, system-ui, -apple-system, Segoe UI, sans-serif","heading_font":"Inter, system-ui, sans-serif","heading_case":"none","density":"comfortable"},"source":"**Antagande:** agentens förslag på visuell riktning för KK-26 (ingen varumärkesprofil finns). Lugn neutral bas, djupt petrolgrön accent och generösa rundningar. Prototypen visar ljust läge. Mörkt läge använder samma tokenstruktur (bakgrund #0E1116, yta #171B22, text #E6E9EE, accent #3FBFAE) och kontrastkontrolleras på samma sätt (se beslut `D-design`).","satisfies":["KK-26","KK-26-A"]},"start":"oversikt","nav":[{"label":"Översikt","goto":"oversikt"},{"label":"Transaktioner","goto":"transak ,"domain"],"satisfies":["KK-14","KK-11-B"]},{"id":"adapter-webpush","name":"adapter-webpush","kind":"adapter","tech":"VAPID (ES256) + aes128gcm via WebCrypto","depends_on":[{"to":"push","label":"Web Push protocol"},"domain"],"satisfies":["KK-27"]},{"id":"adapter-access","name":"adapter-access (auth)","kind":"adapter","tech":"jose-liknande JWT-verifiering via WebCrypto, JWKS cachad","depends_on":[{"to":"access","label":"JWKS /cdn-cgi/access/certs"}],"satisfies":["KK-2-B"]},{"id":"d1","name":"D1 (SQLite)","kind":"database","tech":"Cloudflare D1 free, Time Travel 7 dagar","description":"Krypterad i vila av Cloudflare. Session-id dessutom krypterat på applikationsnivå.","satisfies":["KK-1","KK-32"]},{"id":"access","name":"Cloudflare Access","kind":"external","tech":"Zero Trust free (≤ 50 användare)","description":"Två self-hosted applications (A-4, verifierat): `kronkoll-25e.pages.dev` (produktion) och `*.kronkoll-25e.pages.dev` (förhandsversioner och adresser per deploy). Den återanvändbara policyn *Endast Johan* släpper bara in inbjudna e-postadresser. Sessionslängd 24 h (KK-35). API-workern godtar bara produktionsapplikationens AUD-tagg, så adresser per deploy når inte API:t.","satisfies":["KK-2","KK-2-A"]},{"id":"eb","name":"Enable Banking","kind":"external","tech":"Restricted Production (A-1) / Sandbox","depends_on":[{"to":"skandia","label":"PSD2 AIS"}],"satisfies":["KK-5"]},{"id":"skandia","name":"Skandia (ASPSP)","kind":"external","tech":"BankID-SCA","description":"Konto, sparkonto och Visa (om exponerat – spike). **American Express går inte att koppla i Sverige** → CSV.","satisfies":["KK-6","KK-6-B"]},{"id":"push","name":"Push-tjänster (Apple/Google/Mozilla)","kind":"external","tech":"Gratis Web Push","satisfies":["KK-27"]},{"id":"gha","name":"GitHub Actions","kind":"ci","tech":"Wrangler, Vitest, Playwright, Stryker, gitleaks, actionlint","description":"Workflows: `ci.yml` (PR + main), `deploy.yml` (needs: alla grindar), `nightly.yml` (full Stryker och kontraktstest mot sandbox). Secrets: `CLOUDFLARE_API_TOKEN` (avgränsad), `CLOUDFLARE_ACCOUNT_ID`, `EB_SANDBOX_*`.","depends_on":[{"to":"api","label":"wrangler deploy"},{"to":"web","label":"wrangler pages deploy"},{"to":"d1","label":"migrations apply"}],"satisfies":["KK-16","KK-1-C","KK-12-B","KK-31"]}],"decisions":[{"id":"D-origin","title":"Hur når PWA:n API:t – samma origin eller separat workers.dev?","status":"proposed","context":"Båda värdarna kan skyddas av Access. Men med två origins krävs CORS med credentials mot en annan Access-skyddad värd, och CF_Authorization-cookien är per värd. Det blir krångligt och ökar attackytan.","options":[{"name":"Pages + Pages Function-proxy via service binding","pros":["En origin och en Access-app","Workern får ingen publik URL (workers_dev=false)","Ingen CORS"],"cons":["Varje API-anrop blir två anrop mot gratiskvoten (proxy + Worker)"]},{"name":"Separat api.\u003cnamn>.workers.dev med CORS","pros":["Enkel att förstå"],"cons":["CORS + credentials","Två Access-appar","Publik Worker-URL"]},{"name":"Allt i en Worker med Static Assets","pros":["Ett deployobjekt"],"cons":["Avviker från briefens Pages-krav"]}],"chosen":"Pages + Pages Function-proxy via service binding","rationale":"Minst attackyta och enklast auth. Kvoten räcker med god marginal: en användare med 2 cron-synkar/dygn gör uppskattningsvis \u003c 2 000 anrop/dygn.","satisfies":["KK-2","KK-1","KK-29-B"]},{"id":"D-money","title":"Belopp som heltal öre","status":"proposed","options":["Heltal öre (int64 i SQLite)","Decimalsträngar","Flyttal"],"chosen":"Heltal öre (int64 i SQLite)","rationale":"Exakta summor (uppdelning, budget), enkel jämförelse vid dedup. Formatering bara i UI via Intl sv-SE.","satisfies":["KK-4-A","KK-19-B"]},{"id":"D-dedup","title":"Strategi för dedup och preliminär → bokförd","status":"proposed","context":"Banker byter ofta transaktions-id (eller saknar id) när en preliminär blir bokförd. Ibland ändras även datum och belopp något, t.ex. för hotell eller tankning.","options":[{"name":"Id först, sedan fingeravtryck med datumfönster och löpnummer","pros":["Robust","Idempotent","Hanterar två lika fikor samma dag"],"cons":["Fler kantfall att testa"]},{"name":"Bara provider-id","pros":["Enkelt"],"cons":["Dubbletter när id byts"]},{"name":"Radera alla preliminära och läs om vid varje synk","pros":["Inga matchningsfel"],"cons":["Förlorar manuell kategori och uppdelning på preliminära"]}],"chosen":"Id först, sedan fingeravtryck med datumfönster och löpnummer","rationale":"Behåller användarens arbete (kategori, uppdelning) genom hela livscykeln. Drivs med TDD och egenskapsbaserade tester (fast-check).","satisfies":["KK-9-A","KK-9-B","KK-9-C"]},{"id":"D-rules","title":"Regelmotor: deterministiska regler, ingen ML","status":"proposed","options":["Deterministiska regler med prioritet + normalisering","Lokal ML-klassificerare","Extern AI-tjänst"],"chosen":"Deterministiska regler med prioritet + normalisering","rationale":"Gratis, förklarbar (\"regel: ICA\"), fullt testbar och mutationstestbar. Ingen bankdata lämnar Cloudflare. ML kan prövas senare bakom samma port.","satisfies":["KK-18","KK-1-A","KK-13"]},{"id":"D-frontend","title":"Frontendstack","status":"proposed","options":[{"name":"React + Vite + TanStack Query + visx + Motion","pros":["Största ekosystemet","Bra PWA-plugin","Fina diagram med full kontroll"],"cons":["Större bundle än Svelte"]},{"name":"SvelteKit (adapter-cloudflare)","pros":["Liten bundle","Inbyggda övergångar"],"cons":["SSR i Pages Functions gör auth-ytan större"]},{"name":"SolidStart","pros":["Snabb"],"cons":["Mindre ekosystem"]}],"chosen":"React + Vite + TanStack Query + visx + Motion","rationale":"En statisk SPA gör att bara /api/* körs i Functions, vilket ger enklare hotmodell. **Antagande:** du är bekväm med React. Annars är SvelteKit ett bra alternativ.","satisfies":["KK-25","KK-26","KK-3"]},{"id":"D-design","title":"Designsystem och diagram","status":"proposed","context":"**Antagande (agentens förslag):** tokens för ljust och mörkt läge (se tema), typsnittet Inter med tabellsiffror (font-variant-numeric: tabular-nums) för belopp, 8-punktsgrid, kort med 16 px radie och diagram med visx: mjuka ytor, få axlar, tooltips med exakta belopp. Animationer ≤ 250 ms med easing, av vid prefers-reduced-motion. Över budget visas med färg + ikon + text.","options":["Eget litet designsystem (tokens + 15 komponenter)","shadcn/ui + Tailwind","MUI"],"chosen":"Eget litet designsystem (tokens + 15 komponenter)","rationale":"Ger det lugna, egna uttrycket du ber om. shadcn/ui (Radix-primitiver) kan användas för tillgängliga dialoger och menyer.","satisfies":["KK-26","KK-26-A","KK-26-B","KK-26-C"]},{"id":"D-secrets","title":"Hemlighetshantering och secret scanning","status":"proposed","options":["Worker secrets + GitHub secrets + gitleaks i CI och pre-commit + GitHub secret scanning/push protection (om publikt)","Endast GitHub secret scanning"],"chosen":"Worker secrets + GitHub secrets + gitleaks i CI och pre-commit + GitHub secret scanning/push protection (om publikt)","rationale":"gitleaks fungerar gratis även om repot blir privat (A-8). Lokalt ligger `.dev.vars` (gitignored) med **sandbox**-nycklar. Produktionsnycklar finns bara som Worker secrets och sätts med `wrangler secret put`, aldrig i CI-loggar.","satisfies":["KK-12","KK-12-A","KK-12-B"]},{"id":"D-orm","title":"Databasåtkomst","status":"proposed","options":["Drizzle ORM + wrangler d1 migrations","Kysely","Rå SQL"],"chosen":"Drizzle ORM + wrangler d1 migrations","rationale":"Typer genom hela stacken (KK-3). Används bara i adapter-d1, så domain berörs inte.","satisfies":["KK-3","KK-14-A"]},{"id":"D-loans","title":"Lån: översikt i M2, amortering som sparande","status":"accepted","context":"Ditt svar 2026-11-01: \"Lånöversikt\", lån hos Skandia samt billån eller privatlån.","chosen":"Lånvy per lån och en betalning som delas upp i ränta (utgift) och amortering (sparande) med uppdelningen från KK-19. Mallen får kategorierna Boende › Låneränta och Sparande & överföringar › Amortering.","rationale":"Amortering minskar skulden och är därför inte en utgift. Månadsräntan uppskattas som skuld × ränta / 12, och resten av betalningen räknas som amortering. Ingen prognos för när lånet är betalt och inget ränteavdrag i den här versionen.","satisfies":["KK-36","KK-36-B"]},{"id":"D-users","title":"En användare, inget hushåll","status":"accepted","context":"Ditt svar 2026-11-01: först \"Bara jag i MVP\", sedan \"Skippa household helt\".","chosen":"En användare. Inga hushålls-, ägar- eller synlighetsfält, och etappen M4 (hushåll) är struken.","rationale":"Enklare datamodell, behörigheter och UI. Enable Bankings villkor tillåter dessutom bara att läsa konton som tillhör den som länkade dem.","satisfies":["KK-28"]},{"id":"D-cats","title":"Kategorinivåer","status":"accepted","context":"Ditt svar 2026-11-01.","chosen":"Två nivåer med svensk startmall","satisfies":["KK-18-A"]},{"id":"D-history","title":"Historik vid första koppling","status":"accepted","context":"Ditt svar 2026-11-01. Den faktiska gränsen för Skandia bekräftas i spiken.","chosen":"Så mycket banken ger","satisfies":["KK-5-C"]},{"id":"D-notify","title":"Notiskanal","status":"accepted","context":"Ditt svar 2026-11-01. Appens banner finns alltid som baslinje, eftersom push på iOS kräver installerad PWA.","chosen":"Web Push i PWA + in-app","satisfies":["KK-27"]},{"id":"D-branch","title":"Skydd av main: ruleset + samlad CI-grind","status":"accepted","context":"Din begäran 2026-11-01. Rulesetet ligger i `.github/rulesets/main.json` och importeras i GitHub-UI:t (steg i `docs/github-setup.md`).","chosen":"Ruleset main-skydd: bara PR (squash), statuskontrollen ci-ok måste vara grön, grenen uppdaterad, konversationer lösta, linjär historik, ingen force push eller radering, inga bypass-aktörer","rationale":"En samlande grind (`ci-ok`) gör att nya grindar bara läggs till i `needs:` i ci.yml. 0 godkännanden krävs eftersom du är ensam och inte kan godkänna din egen PR. Deploy-hemligheter ligger bara i miljön production, som är låst till main.","satisfies":["KK-16","KK-16-B","KK-31","KK-12-B"]},{"id":"D-repo","title":"Publikt repo","status":"accepted","context":"Ditt svar i granskningen 2026-11-01.","chosen":"Publikt GitHub-repo","rationale":"Ger gratis secret scanning, push protection och obegränsade Actions-minuter. gitleaks körs ändå i CI som ett andra lager. Allt i repot ska klara att vara offentligt: bara syntetisk data och inga hemligheter (KK-12, KK-13).","satisfies":["KK-12","KK-12-B","KK-1-A"]},{"id":"D-sync","title":"Synkfrekvens: 2 gånger per dygn","status":"accepted","context":"Ditt svar i granskningen 2026-11-01. Ger god marginal till bankens gräns för obevakade anrop och till Cloudflares kvoter.","chosen":"Cron 7 4,15 * * * (UTC) + manuell synk högst 1 gång/15 min","satisfies":["KK-7","KK-7-C","KK-1-B"]},{"id":"D-retention","title":"Lagringstid för transaktioner","status":"accepted","context":"Ditt svar i granskningen 2026-11-01.","chosen":"Tills användaren raderar","rationale":"Ger full historik för trender och jämförelser kring föräldraledighet. Minimeringen sker i stället i vad som lagras (inga råsvar, maskerat konto, krypterat session-id) och med tydlig radering (KK-11). Driftloggar (SyncRun) gallras ändå efter 90 dagar.","satisfies":["KK-11","KK-11-C"]},{"id":"D-rollover","title":"Ingen överföring av budgetrest mellan månader","status":"accepted","context":"Ditt svar i granskningen 2026-11-01.","chosen":"Nej – varje period börjar från sin egen budget","satisfies":["KK-20"]},{"id":"D-mutation","title":"Mutationströskel 85 % för domain","status":"accepted","context":"Ditt svar i granskningen 2026-11-01.","chosen":"Stryker break-threshold 85 % (high 90, low 85) på packages/domain","rationale":"Körs inkrementellt på ändrade filer i varje PR och som full körning nattligt. Under 85 % blockeras deploy.","satisfies":["KK-16-A"]},{"id":"D-pending","title":"Preliminära transaktioner räknas i budget","status":"accepted","context":"Ditt svar i granskningen 2026-11-01.","chosen":"Ja – bokförda + preliminära (ej borttagna)","satisfies":["KK-17-B","KK-9-C"]},{"id":"D-leave","title":"Inkomst under föräldraledighet","status":"accepted","context":"Ditt svar 2026-11-01.","chosen":"Uppskattning från årsparametrar + manuell justering","satisfies":["KK-23-A","KK-23-B"]}],"open_questions":[{"id":"Q-skandia","question":"Finns Skandia hos Enable Banking, och kommer Visa-kortet som eget konto med preliminära transaktioner?","priority":"blocking","context":"Besvaras av spiken i M0 (`GET /aspsps?country=SE` + sandbox + en riktig koppling i Restricted Production). Saknas kortet blir CSV-import reservplanen för kortet.","options":["Konto + kort finns","Bara konto – kort via CSV","Skandia saknas – allt via CSV i MVP"],"related":["KK-6","KK-6-A","KK-10","R-2"],"answer":"Konto + kort finns (2026-11-01). Spiken visade att Skandia finns som ASPSP `Skandia` med samtycke upp till 180 dagar, och när Johan länkade produktionsappen syntes alla konton med Visa-kortet som eget konto. CSV behövs alltså bara för Amex. Preliminära transaktioner levereras också, även på kontona som korten är kopplade till (verifierat i produktion 2026-11-04, se `docs/spike-enable-banking.md`)."},{"id":"Q-mvp-scope","question":"När planerar du nästa föräldraledighet? Ska sparmål och ledighetsplanering in redan i MVP?","priority":"high","context":"Förslaget lägger sparmål och inkomst i M2, direkt efter MVP. Börjar ledigheten inom ~4 månader bör M2 flyttas in i MVP.","options":["Behåll förslaget (M2)","Flytta inkomst + ledighet till MVP","Flytta allt i M2 till MVP"],"related":["KK-21","KK-22","KK-23","M1","M2"],"answer":"Behåll förslaget: sparmål och ledighetsplanering i M2."},{"id":"Q-repo","question":"Ska repot vara publikt eller privat?","priority":"high","context":"Publikt: GitHub secret scanning, push protection och Actions-minuter är gratis. Privat: Actions har 2 000 min/mån och secret scanning kräver betald GHAS (A-8). Planen fungerar med båda tack vare gitleaks.","options":["Publikt","Privat (gitleaks + sparsam CI)"],"related":["KK-12","KK-1-A","R-7"],"answer":"Publikt (se D-repo)."},{"id":"Q-pending-budget","question":"Ska preliminära transaktioner räknas i budget och \"kvar att spendera\"?","priority":"medium","context":"Antagandet i KK-17-B är **ja**. Det ger en ärligare bild direkt efter köp men kan svaja när reservationer släpps, t.ex. för hotell eller bensin.","options":["Ja (antagande)","Nej – bara bokförda","Ja, men visa separat"],"related":["KK-17-B","KK-9"],"answer":"Ja – preliminära räknas i budget och kvar att spendera (KK-17-B oförändrat)."},{"id":"Q-retention","question":"Hur länge ska transaktioner sparas?","priority":"medium","context":"Minimal lagring (KK-11) talar för en gräns. Trender och jämförelser med föräldraledighet talar för minst 24 mån.","options":["Tills jag raderar","Rullande 36 mån","Rullande 24 mån"],"related":["KK-11","KK-22-B"],"answer":"Tills jag raderar (se D-retention)."},{"id":"Q-rollover","question":"Ska överskott eller underskott i en kategori föras över till nästa månad?","priority":"low","options":["Nej (enklast)","Ja, valbart per kategori","Ja, för alla"],"related":["KK-20"],"answer":"Nej (enklast) – se D-rollover."},{"id":"Q-mutation","question":"Vilken mutation score ska vara tröskel för domänlagret?","priority":"medium","context":"Förslag: 80 % (break) i nattlig full körning och inkrementellt på ändrade filer i PR. 90 % ger hög trygghet men ofta jakt på likvärdiga mutanter.","options":["80 %","85 %","90 %","70 %"],"related":["KK-16","KK-16-A"],"answer":"85 % (se D-mutation)."},{"id":"Q-sync-times","question":"Är 4 hämtningar per dygn (≈ 06, 12, 17, 22) rätt, eller vill du ha fler?","priority":"low","context":"Banker kan begränsa obevakade AIS-anrop till 4 per dygn enligt PSD2 RTS (antagande). Mer än 4 riskerar 429. Manuell synk när appen är öppen räknas som bevakad och är därför tillåten oftare.","options":["4/dygn","2/dygn","Max bankens gräns"],"related":["KK-7","KK-7-C"],"answer":"2 hämtningar per dygn (se D-sync). Manuell synk finns kvar."},{"id":"Q-eb-terms","question":"Har du läst Enable Bankings villkor för Restricted Production (kostnad, antal konton, giltighetstid för appen)?","priority":"high","context":"Antagande A-1: det är gratis för egna konton. Om villkoren kräver betalning eller företag blir CSV-adaptern huvudspår och planen behöver en ny leverantör.","options":["Ja, gratis – bekräftat","Nej, kolla i spiken"],"related":["KK-1-A","KK-5","R-1"],"answer":"Ja, gratis för privat bruk – bekräftat 2026-11-01. Villkoren tillåter produktion för länkade konton för privatpersoners eget bruk, förbjuder kommersiellt bruk och åtkomst för tredje part, och anger att antalet länkade konton kan begränsas. Ingen kostnad nämns."}],"risks":[{"id":"R-1","risk":"Enable Banking ändrar villkoren för Restricted Production eller tar betalt.","likelihood":"medium","impact":"high","mitigation":"BankDataProvider-porten och CSV-adaptern finns från MVP. Kontraktstestsviten gör det billigt att lägga till en ny leverantör. Flaggat enligt KK-1-A.","satisfies":["KK-14-B","KK-1-A"]},{"id":"R-2","risk":"Skandia saknas, eller Visa-kortet exponeras inte som eget konto.","likelihood":"medium","impact":"medium","mitigation":"Spike först (M0). CSV-import för kortet. Skandia Visa går att exportera som fil (antagande).","satisfies":["KK-6","KK-10"]},{"id":"R-3","risk":"Free-gränsen på 10 ms CPU per Worker-anrop överskrids vid stor initial import (JSON-parsning av många sidor).","likelihood":"high","impact":"medium","mitigation":"Mätt 2026-11-04: en manuell synk av fyra konton tog 108 ms CPU och slutade ändå ok, så gränsen överskrids redan men stoppas inte. Sidvis hämtning med sparad cursor, en sida per steg. Fortsätter i följande anrop. Ingen tung kryptering i loopen (JWT signeras en gång per körning).","satisfies":["KK-1-B","KK-7"]},{"id":"R-4","risk":"Samtycket går ut obemärkt och ger glapp i data.","likelihood":"high","impact":"low","mitigation":"Daglig kontroll, banner + push 14/3/0 dagar före, koppla om fyller glappet med överlapp och dedup. Om banken bara ger 90 dagar bakåt vid koppla om kan större glapp fyllas med CSV.","satisfies":["KK-8","KK-27-B"]},{"id":"R-5","risk":"Web Push opålitligt på iOS (kräver installerad PWA, kan tystas).","likelihood":"medium","impact":"low","mitigation":"Appens banner och inkorg är baslinjen. Push är ett extra lager.","satisfies":["KK-27"]},{"id":"R-6","risk":"Föräldrapenningregler och parametrar ändras eller missförstås, så att prognosen blir fel.","likelihood":"medium","impact":"medium","mitigation":"Årsparametrar i tabell med källa, tydlig \"uppskattning\"-text och manuellt överstyrt belopp. Unit-tester per år.","satisfies":["KK-23-A","KK-23-B"]},{"id":"R-7","risk":"Om repot någon gång görs privat: GitHub Actions-minuter (2 000/mån) tar slut på grund av Stryker och Playwright, och secret scanning blir betalt. Repot är publikt (D-repo), så risken gäller bara vid ett byte.","likelihood":"low","impact":"medium","mitigation":"Inkrementell Stryker i PR och full nattligt bara vid ändringar i domain. Playwright bara med Chromium och mobil viewport. gitleaks i stället för GHAS. Repot är publikt enligt beslut D-repo.","satisfies":["KK-1-A","KK-16"]},{"id":"R-8","risk":"Dedup slår ihop två legitima, identiska köp (två kaffe à 45 kr samma dag hos samma motpart).","likelihood":"medium","impact":"low","mitigation":"Löpnummer i fingeravtrycket och provider-id först. Egenskapsbaserade tester.","satisfies":["KK-9-A"]},{"id":"T-S1","risk":"[Hot · STRIDE S – Spoofing] Någon anropar API-workern direkt och kringgår Access.","likelihood":"low","impact":"high","mitigation":"workers_dev=false (ingen publik URL), bara service binding. Workern validerar ändå Access-JWT (signatur mot JWKS, aud, iss, exp) och e-post mot allowlist.","satisfies":["KK-2-B"]},{"id":"T-S2","risk":"[Hot · S] Inloggnings-CSRF i bankcallbacken: en angripare får sin egen bankkoppling inlagd hos dig, eller tvärtom.","likelihood":"low","impact":"medium","mitigation":"HMAC-signerat engångs-state, bundet till användaren, giltigt i 15 min (KK-29).","satisfies":["KK-29-A"]},{"id":"T-T1","risk":"[Hot · T – Tampering] CSRF mot ändrande endpoints (radera koppling, ändra budget).","likelihood":"low","impact":"medium","mitigation":"SameSite-cookie från Access, Origin-kontroll och krav på X-Kronkoll-header. Destruktiva åtgärder kräver bekräftelse i UI.","satisfies":["KK-29-B"]},{"id":"T-T2","risk":"[Hot · T] Lagrad XSS via motpartsnamn eller beskrivning från banken.","likelihood":"low","impact":"high","mitigation":"React-escaping, lint förbjuder dangerouslySetInnerHTML, strikt CSP utan inline-skript (KK-30).","satisfies":["KK-30-A","KK-30-B"]},{"id":"T-R1","risk":"[Hot · R – Repudiation] Oklart vem eller vad som raderade eller kopplade om en bank.","likelihood":"low","impact":"low","mitigation":"Minimal säkerhetslogg (händelse, tid, e-post-hash) utan bankdata, sparad i 90 dagar.","satisfies":["KK-13-A"]},{"id":"T-I1","risk":"[Hot · I – Information disclosure] Den privata RSA-nyckeln läcker (repo, CI-logg, laptop).","likelihood":"low","impact":"high","mitigation":"Bara som Worker secret, med sandbox-nyckel lokalt. gitleaks + push protection. Rutin för nyckelrotation (ny nyckel i Enable Banking-kontrollpanelen). Restricted Production begränsar skadan till egna konton och endast läsning.","satisfies":["KK-12","KK-5"]},{"id":"T-I2","risk":"[Hot · I] Bankdata hamnar i loggar (Workers Logs, CI, felrapporter).","likelihood":"medium","impact":"medium","mitigation":"Logger med vitlista (KK-13-A). Inga request bodies loggas, felkoder i stället för svarstext. Syntetiska fixtures. Ingen tredjeparts felrapportering.","satisfies":["KK-13-A","KK-13-B"]},{"id":"T-I3","risk":"[Hot · I] En stulen eller upplåst mobil med installerad PWA visar bankdata.","likelihood":"medium","impact":"medium","mitigation":"Access-session 24 h, cache högst 24 h och Cache-Control: no-store på API. Logga ut rensar enheten (KK-35). Push-texter innehåller inga belopp per transaktion.","satisfies":["KK-25-B","KK-35-A","KK-27-A"]},{"id":"T-I4","risk":"[Hot · I] Databasdump (D1-export, kapad Cloudflare-token) läcker session-id och transaktioner.","likelihood":"low","impact":"high","mitigation":"Session-id krypterat med AES-GCM. Utan JWT-nyckeln är det ändå oanvändbart. IBAN lagras bara som HMAC-hash. CLOUDFLARE_API_TOKEN avgränsad och bara i GitHub Environments med skydd för main. 2FA på Cloudflare och GitHub.","satisfies":["KK-11-C","KK-31"]},{"id":"T-I5","risk":"[Hot · I] Leveranskedjeattack: ett skadligt npm-paket eller en kapad action exfiltrerar secrets.","likelihood":"medium","impact":"high","mitigation":"KK-31: pinnade actions (SHA), minimal permissions, npm ci --ignore-scripts, få beroenden i Workern, Dependabot. Deploy-jobbet har inga sandbox-hemligheter och testjobben inga produktionshemligheter.","satisfies":["KK-31-A"]},{"id":"T-D1","risk":"[Hot · D – Denial of service] Kvoten (100 000 anrop/dygn) förbrukas av obehöriga eller av en loop.","likelihood":"low","impact":"low","mitigation":"Access stoppar obehöriga redan i kanten, före Workern. Manuell synk är begränsad (KK-7-C). Daglig synk är idempotent. Free tier har inget överdebiteringsläge: tjänsten stängs av i stället för att faktureras (A-3).","satisfies":["KK-7-C","KK-1-A"]},{"id":"T-E1","risk":"[Hot · E – Elevation of privilege] Kronkoll används för att initiera betalningar.","likelihood":"low","impact":"high","mitigation":"Bara AIS-scope i /auth. Ingen PIS-kod. Test/lintregel förbjuder /payments (KK-5-A). Enable Banking-appen registreras endast för AIS (antagande).","satisfies":["KK-5-A"]}],"milestones":[{"id":"M0","title":"M0 · Fundament och spike","target":"Vecka 1–2","description":"Repo med `.gitignore` (KK-12-A) från första commit, monorepo (pnpm workspaces: `packages/domain`, `apps/api`, `apps/web`), CI-grindar och deploy av en hello-app bakom Access. **Spike:** ASPSP-lista SE, Skandia konto och kort, samtyckestid, historikdjup, CPU-tid för en importsida och test av JWT-signering. Spiken kontrollerar också Enable Bankings villkor för Restricted Production (kostnad, antal konton, appens giltighetstid). Resultatet stänger Q-skandia och Q-eb-terms. **Första steg:** aktivera secret scanning och push protection på det publika repot (D-repo).","includes":["login","F-auth","F-ci","gha","access","pages-fn","api","eb-api","adapter-access","D-origin","D-secrets"]},{"id":"M1","title":"M1 · MVP: koppla, se, kategorisera, budgetera","target":"Vecka 3–8","description":"**MVP-avgränsning:** koppla Skandia (eller CSV), automatisk synk med dedup, transaktionslista, kategorisering med inlärning och uppdelning, budget per kategori, översikt med \"kvar att spendera\" och trend, samtyckesbanner, koppla om, radering, PWA i ljust och mörkt läge. Push, insikter, sparmål och inkomstplanering ingår inte.","includes":["oversikt","transaktioner","transaktion","regel-historik","dela-upp","budget","budget-redigera","budget-ta-bort","installningar","koppling","radera-koppling","koppla-bank","koppla-samtycke","koppla-hamtar","csv-import","kategorier","api-overview","api-transactions","api-tx-patch","api-rule-apply","api-tx-split","api-budget","api-budget-delete","api-conn-start","api-conn-callback","api-conn-renew","api-conn-delete","api-sync","api-csv","job-sync","job-daily","evt-imported","port-bank","port-repo","F-dataflode","F-koppla","F-koppla-om","F-conn-state","F-tx-state","F-learn","F-contract-nightly","Settings","User","BankConnection","Account","Transaction","TransactionSplit","Category","CategoryRule","BudgetLine","SyncRun","web","domain","adapter-eb","adapter-csv","adapter-d1","d1"]},{"id":"M2","title":"M2 · Sparmål, lån och inkomst (föräldraledighet)","target":"Vecka 9–11","description":"Sparmål med prognos, lånöversikt med ränta och amortering (KK-36), inkomstklassning, inkomsthistorik, planering av ledighet med omräkning av budget och sparmål. Se Q-mvp-scope om detta ska tidigareläggas.","includes":["sparmal","sparmal-detalj","sparmal-nytt","lan","api-loans","Loan","inkomst","ledighet-ny","api-goals","api-income","api-leave","F-leave","SavingsGoal","GoalContribution","LeavePeriod","IncomeParameters"]},{"id":"M3","title":"M3 · Insikter och notiser","target":"Vecka 12–13","description":"Återkommande dragningar, avvikelser och topplistor. Web Push för samtycke, budget och synkfel.","includes":["insikter","api-insights","api-push","port-notify","PushSubscription","adapter-webpush","push"]}],"verification":[{"id":"V-u-money","title":"domain/money + format: sv-SE belopp och datum","type":"unit","given":"1234567 öre, 2026-11-03","when":"formatAmount / formatDate","then":"\"12 345,67 kr\", \"3 nov. 2026\", \"2026-11-03\"; veckostart måndag","satisfies":["KK-4-A","KK-4-B"]},{"id":"V-u-period","title":"domain/period: svensk tid och lönedagsperiod","type":"unit","given":"Clock i UTC 2026-10-31T23:30Z (00:30 svensk tid 1 nov.) och booking_date 2026-10-31","when":"perioden räknas","then":"rätt period i Europe/Stockholm; startdag 25 flyttas till närmast föregående bankdag","satisfies":["KK-33-A","KK-34-A"]},{"id":"V-u-reconcile","title":"domain/reconcile: dedup och PDNG→BOOK (TDD + fast-check)","type":"unit","given":"syntetiska serier från fixture-fabriken","when":"samma batch importeras 1–n gånger, i olika ordning, med id-byte vid bokföring","then":"exakt en rad per verklig transaktion; preliminär ersätts och behåller kategori och uppdelning; försvunnen preliminär efter 10 dagar → removed; CSV-dubbletter ignoreras","satisfies":["KK-9-A","KK-9-B","KK-9-C","KK-10-B"]},{"id":"V-u-transfers","title":"domain/transfers: interna överföringar och kortfaktura","type":"unit","given":"−5 000 kr från privatkonto och +5 000 kr på sparkonto samma dag; betalning till Visa","when":"classify körs","then":"båda markeras interna och räknas inte i budgetutfall","satisfies":["KK-20-C"]},{"id":"V-u-categorize","title":"domain/normalize + categorize: regler och inlärning","type":"unit","given":"\"ICA NARA SOFO STHLM\", \"K*ICA KVANTUM\", manuellt kategoriserad ICA-rad","when":"en regel lärs in och appliceras bakåt","then":"normaliseras till ICA och regeln matchar; den manuella raden ändras inte; prioritet manuell > inlärd > mall","satisfies":["KK-18-B","KK-18-C"]},{"id":"V-u-template","title":"Kategorimall: två nivåer, redigerbar","type":"unit","given":"seed-mallen","when":"byt namn, slå ihop, arkivera","then":"12 huvudkategorier med underkategorier; vid sammanslagning flyttas transaktioner och regler","satisfies":["KK-18-A"]},{"id":"V-u-split","title":"domain/split: summainvariant","type":"unit","given":"−124 000 öre","when":"delar −90 000 + −34 000 respektive −90 000 + −30 000","then":"ok respektive SplitSumMismatch(kvar −4 000)","satisfies":["KK-19-A","KK-19-B"]},{"id":"V-u-budget","title":"domain/budget + overview: utfall, kvar och förslag","type":"unit","given":"budget, transaktioner (bokförda, preliminära, uppdelade) och 3 månaders historik","when":"utfall räknas","then":"rätt utfall, kvar, andel och över-flagga; kvar per dag; kopiera föregående och snittförslag","satisfies":["KK-20-A","KK-20-B","KK-17-B"]},{"id":"V-u-loans","title":"domain/loans: månadskostnad och uppdelning av betalning","type":"unit","given":"bolån 2 400 000 kr, 3,5 %, amortering 4 000 kr/mån och en betalning på 11 000 kr","when":"betalningen delas upp","then":"7 000 kr ränta + 4 000 kr amortering; bindningstid inom 60 dagar flaggas","satisfies":["KK-36-B","KK-36-C"]},{"id":"V-e2e-loans","title":"E2E: lägg till lån och se översikten","type":"e2e","given":"inga lån","when":"ett lån läggs till för hand","then":"lånvyn visar skuld, ränta, bindningstid och månadskostnad samt totalsummor","satisfies":["KK-36-A","KK-36-C"]},{"id":"V-u-goals","title":"domain/goals: prognos inklusive kantfall","type":"unit","given":"60 000 kr, 21 500 sparat, takt 3 200/mån, måldatum aug. 2027","when":"prognos räknas","then":"13 mån → dec. 2027, ej i fas, krävs 4 278/mån; takt ≤ 0 → \"nås inte\"","satisfies":["KK-21-A","KK-21-B"]},{"id":"V-u-income","title":"domain/income-classify","type":"unit","given":"inbetalningar från FÖRSÄKRINGSKASSAN, \"LÖN ACME AB\", Swish","when":"classify körs","then":"föräldrapenning, lön respektive övrigt; manuell ändring lär en regel","satisfies":["KK-22-A"]},{"id":"V-u-forecast","title":"domain/income-forecast: föräldrapenning per år","type":"unit","given":"SGI 540 000 kr, 5 dagar/vecka, föräldralön 10 %, skatt 31,5 %, parametrar 2026/2027; samt SGI över taket","when":"uppskattning och omräkning","then":"≈ 1 148 kr/dag; taket tillämpas; manuellt belopp vinner; sparmål och kvar att spendera räknas om för berörda månader","satisfies":["KK-23-A","KK-23-B","KK-23-C"]},{"id":"V-u-insights","title":"domain/insights: återkommande, avvikelser, topp 5","type":"unit","given":"syntetiska 13 månader med Netflix månadsvis, försäkring årsvis och en restaurangtopp","when":"insikter räknas","then":"serier med nästa datum och årskostnad; avvikelse bara när > 30 % och ≥ 500 kr; topp 5 korrekt","satisfies":["KK-24-A","KK-24-B","KK-24-C"]},{"id":"V-u-consent","title":"domain/consent + notify-rules","type":"unit","given":"expires_on och dagens datum; kategori som passerar 100 %","when":"regler utvärderas","then":"expiring vid ≤ 14 dagar; påminnelser 14/3/0; budgetnotis en gång per kategori och period, utan transaktionsbelopp","satisfies":["KK-8-A","KK-27-A","KK-27-B"]},{"id":"V-u-logger","title":"Logger med vitlista (redaction)","type":"unit","given":"ett loggobjekt med amount, counterparty och iban","when":"det loggas","then":"endast vitlistade fält skrivs ut, övrigt blir [redacted]","satisfies":["KK-13-A"]},{"id":"V-u-jwt","title":"adapter-enablebanking: JWT via WebCrypto","type":"unit","given":"genererat testnyckelpar (aldrig riktig nyckel)","when":"JWT byggs","then":"RS256, kid = app id, exp − iat ≤ 300 s, verifierbar med publik nyckel","satisfies":["KK-5-B"]},{"id":"V-u-csv","title":"adapter-csv: parser och mappning","type":"unit","given":"syntetisk CSV (semikolon, komma-decimal, BOM)","when":"dry_run + import","then":"rätt antal nya och dubbletter, belopp i öre","satisfies":["KK-10-A"]},{"id":"V-u-xss","title":"Rendering av opålitliga banktexter","type":"unit","given":"fixture med motpart `\u003cimg src=x onerror=alert(1)>`","when":"TransactionRow renderas (Vitest + Testing Library)","then":"texten visas som ren text och inget img-element skapas","satisfies":["KK-30-A"]},{"id":"V-i-access","title":"Worker: Access-JWT-validering","type":"integration","given":"vitest-pool-workers med testad JWKS","when":"anrop med giltig, fel aud, utgången och saknad JWT","then":"200 / 401 / 401 / 401; inget innehåll loggas","satisfies":["KK-2-B"]},{"id":"V-i-csrf","title":"Worker: CSRF och bank-state","type":"integration","given":"inloggad användare","when":"POST utan X-Kronkoll, callback med återanvänt eller utgånget state","then":"403 respektive 400; ingen session skapas","satisfies":["KK-29-A","KK-29-B"]},{"id":"V-i-sync","title":"Worker scheduled(): synk mot fejkad BankDataProvider + riktig D1","type":"integration","given":"två konton, ett som ger 429","when":"scheduled-handlern körs två gånger","then":"det friska kontot synkas och last_success_at sätts; det trasiga loggas med felkod och försöks igen; ingen dubblett; manuell synk ger 429 inom 15 min","satisfies":["KK-7-A","KK-7-B","KK-7-C"]},{"id":"V-i-renew","title":"Koppla om: kontomatchning och glapp","type":"integration","given":"utgången koppling med 3 konton, ny session med nya uid","when":"renew + callback","then":"konton matchas via IBAN-hash; glappet hämtas; 0 dubbletter","satisfies":["KK-8-B"]},{"id":"V-i-delete","title":"Radering med och utan purge","type":"integration","given":"koppling med konton, transaktioner och uppdelningar i D1","when":"DELETE ?purge=true","then":"fejkad EB får DELETE /sessions; 0 kvarvarande rader för kopplingen; svaret anger att backup förfaller efter 7 dagar","satisfies":["KK-11-A","KK-11-B","KK-32-A"]},{"id":"V-i-storage","title":"Lagringsminimering","type":"integration","given":"en import från fejkad EB med fullt rått svar","when":"D1 inspekteras","then":"inga råa JSON-kolumner; kontonummer maskerat; session_id krypterat och inte i klartext","satisfies":["KK-11-C"]},{"id":"V-i-push","title":"adapter-webpush mot lokal mottagare","type":"integration","given":"testprenumeration med kända nycklar","when":"Notifier.send körs","then":"giltig VAPID-JWT och dekrypterbar aes128gcm-payload; 410 tar bort prenumerationen","satisfies":["KK-27-A"]},{"id":"V-c-provider","title":"Kontraktssvit BankDataProvider (sandbox + CSV)","type":"integration","given":"Enable Banking sandbox (Mock ASPSP) och CSV-adapter","when":"samma svit körs mot båda","then":"båda ger giltiga ImportedTransaction; EB-adaptern anropar bara AIS-endpoints (spionerande fetch); initial hämtning använder bankens maxhistorik","satisfies":["KK-14-B","KK-5-A","KK-5-C"]},{"id":"V-a-arch","title":"Arkitekturtest (dependency-cruiser)","type":"unit","given":"kodbasen","when":"CI kör depcruise","then":"domain importerar inget utanför sig självt; inga @cloudflare-typer i domain; ingen sträng /payments i adaptrar","satisfies":["KK-14-A","KK-5-A"]},{"id":"V-ci-gates","title":"CI: grindar blockerar deploy","type":"integration","given":"en PR som sänker coverage i domain till 85 %","when":"CI körs","then":"coverage-steget faller och deploy körs inte; deploy.yml har needs på alla grindar; tsc strict körs för alla paket","satisfies":["KK-16-A","KK-16-B","KK-3-A","KK-1-C"]},{"id":"V-ci-mutation","title":"Stryker på domain","type":"integration","given":"nattlig full körning","when":"mutation score \u003c 85 % (D-mutation)","then":"jobbet fallerar och deploy av domain-ändringar blockeras","satisfies":["KK-16-A","KK-15-A"]},{"id":"V-ci-secrets","title":"Hemligheter: gitleaks + push protection","type":"integration","given":"en testgren med en påhittad PEM-nyckel","when":"push","then":"push protection eller gitleaks stoppar; .gitignore innehåller .dev.vars, .env*, *.pem och *.key","satisfies":["KK-12-A","KK-12-B"]},{"id":"V-m-ruleset","title":"Branch protection för main","type":"manual","given":"rulesetet main-skydd importerat och inställningarna i docs/github-setup.md gjorda","when":"direkt push till main, och en PR med röd ci-ok","then":"pushen nekas och PR:en kan inte mergas","satisfies":["KK-16-B"]},{"id":"V-ci-supply","title":"Workflow-lint (actionlint/zizmor)","type":"integration","given":"workflows","when":"CI körs","then":"alla uses pinnade på SHA och permissions satt explicit","satisfies":["KK-31-A"]},{"id":"V-e2e-connect","title":"E2E: koppla bank (sandbox) och samtyckesbanner","type":"e2e","given":"Playwright i mobil viewport mot preview, EB sandbox","when":"Koppla bank → Mock ASPSP → tillbaka","then":"konton syns, historik hämtad; med klocka 14 dagar före utgång syns bannern med Koppla om","satisfies":["KK-15-B","KK-8-A"]},{"id":"V-e2e-categorize","title":"E2E: kategorisera och dela upp","type":"e2e","given":"syntetiska transaktioner seedade","when":"byt kategori med Gör alltid så; dela upp 1 240 kr","then":"regeln skapas och syns under Regler; uppdelningen syns i listan; fel summa blockerar Spara","satisfies":["KK-18-B","KK-19-A","KK-19-B","KK-15-B"]},{"id":"V-e2e-budget","title":"E2E: sätta budget","type":"e2e","given":"november utan budget","when":"Föreslå från snitt, justera Mat till 6 300, spara","then":"Mat visar 104 % – över (färg + text)","satisfies":["KK-20-A","KK-20-B","KK-15-B"]},{"id":"V-u-balances","title":"Saldo per konto i översikten","type":"unit","given":"tre syntetiska konton, ett utan saldo från banken","when":"översikten hämtas och visas","then":"varje konto visas med sitt namn och saldo, kontot utan saldo visar Saldo saknas, och totalen är summan av de två andra","satisfies":["KK-38-A","KK-38-B"]},{"id":"V-u-exclude","title":"domain: Räknas inte","type":"unit","given":"en novembermånad med en utgift på 1 299 kr markerad Räknas inte, och en regel med åtgärden Räkna inte","when":"budgetens utfall, översikten och överföringarna räknas","then":"utgiften är inte med i ut, utfall, kvar att spendera eller trend; saldot är oförändrat; regeln markerar sina träffar men aldrig ett eget val eller ett par, och utan regeln räknas de igen","satisfies":["KK-39-A","KK-39-C","KK-39-D"]},{"id":"V-i-exclude","title":"API: markera, ångra och regel för Räknas inte","type":"integration","given":"lokal D1 med syntetiska transaktioner, en manuellt avmarkerad","when":"PUT /transfer med internal true/false/null och en regel med action exclude appliceras bakåt","then":"markeringen sätts och tas bort; regeln markerar träffarna men inte den manuellt avmarkerade","satisfies":["KK-39-B","KK-39-C"]},{"id":"V-e2e-exclude","title":"E2E: räkna inte en transaktion","type":"e2e","given":"syntetiska transaktioner i november","when":"markera en utgift Räknas inte, öppna budget, ångra","then":"raden är nedtonad med texten Räknas inte och utfallet minskar; efter ångra är allt som innan","satisfies":["KK-39-A","KK-39-B"]},{"id":"V-i-budget-delete","title":"API: ta bort en periods budget","type":"integration","given":"budget för oktober och november i lokal D1","when":"DELETE /api/budgets/2026-11 med och utan CSRF-header","then":"med header: november saknar budget, oktober är orörd; utan header: 403 och inget ändras","satisfies":["KK-40-A","KK-40-B"]},{"id":"V-e2e-goal","title":"E2E: skapa sparmål","type":"e2e","given":"inga sparmål","when":"skapa Resa till Japan 60 000 / aug. 2027","then":"prognos och krav per månad visas; måldatum i dåtid ger fel","satisfies":["KK-21-A","KK-15-B"]},{"id":"V-e2e-leave","title":"E2E: planera ledighet","type":"e2e","given":"inkomsthistorik och ett sparmål","when":"lägg till mars–aug. 2027","then":"uppskattning, påverkan på budget april 2027 och sparmål visas; manuellt belopp slår igenom","satisfies":["KK-23-A","KK-23-C","KK-22-B"]},{"id":"V-e2e-dashboard","title":"E2E: översikt","type":"e2e","given":"syntetisk månad","when":"öppna appen","then":"saldo, in, ut, kvar att spendera, senaste synk och 12-månaderstrend stämmer mot fixture","satisfies":["KK-17-A","KK-17-C"]},{"id":"V-e2e-pwa","title":"PWA: Lighthouse installability + offline","type":"e2e","given":"produktionsbygge","when":"Lighthouse CI och Playwright offline-läge","then":"manifest, ikoner och service worker godkända; offline visar senaste översikt med tidsstämpel; cache > 24 h ignoreras","satisfies":["KK-25-A","KK-25-B"]},{"id":"V-e2e-a11y","title":"Tillgänglighet och rörelse","type":"e2e","given":"ljust och mörkt läge","when":"axe körs på huvudvyerna och prefers-reduced-motion emuleras","then":"inga AA-kontrastfel; animationer avstängda","satisfies":["KK-26-A","KK-26-B"]},{"id":"V-u-toast","title":"Bekräftelser försvinner, fel ligger kvar","type":"unit","given":"en bekräftelse och ett fel i appen","when":"4 sekunder går med falsk klocka","then":"bekräftelsen är borta och läses upp av skärmläsare (role=status); felet syns kvar","satisfies":["KK-26-C"]},{"id":"V-e2e-csp","title":"Säkerhetsheaders","type":"e2e","given":"preview-deploy","when":"hämta / och /api/overview","then":"CSP enligt KK-30-B, no-store på API","satisfies":["KK-30-B"]},{"id":"V-e2e-logout","title":"Logga ut rensar enheten","type":"e2e","given":"inloggad med cachad översikt","when":"Logga ut och rensa enheten","then":"Cache Storage och IndexedDB tomma; omdirigering till Access","satisfies":["KK-35-A"]},{"id":"V-e2e-csv","title":"E2E: CSV-import","type":"e2e","given":"syntetisk Amex-CSV","when":"importera två gånger","then":"första gången 142 nya; andra gången 0 nya och 142 dubbletter","satisfies":["KK-10-A","KK-10-B"]},{"id":"V-m-spike","title":"Spike-protokoll Skandia","type":"manual","given":"EB sandbox + Restricted Production","when":"ASPSP-lista, koppling och hämtning","then":"protokollet besvarar KK-6-A; Amex-notisen finns i UI och plan","satisfies":["KK-6-A","KK-6-B"]},{"id":"V-m-access","title":"Manuell Access-kontroll","type":"manual","given":"en icke inbjuden e-post","when":"öppna kronkoll-25e.pages.dev","then":"nekad; inga /api-anrop når Workern (kontrollera Workers-analytics)","satisfies":["KK-2-A"]},{"id":"V-m-cost","title":"Kostnads- och kvotkontroll","type":"monitor","given":"Cloudflare- och GitHub-dashboards","when":"månadsvis, och efter första initiala importen","then":"\u003c 10 % av anrops-, läs- och skrivkvoter; inga betalda tillägg aktiverade; inga fakturor med belopp; betalkort registrerat bara för Zero Trust free (krävs, A-3)","satisfies":["KK-1-A","KK-1-B"]},{"id":"V-m-fixtures","title":"Granskning: syntetisk testdata","type":"manual","given":"PR-checklista","when":"fixtures eller testdata ändras","then":"skapade via fixture-fabriken; inga inspelade produktionssvar; gitleaks-regel för personnummer och kontonummer","satisfies":["KK-13-B"]},{"id":"V-m-design","title":"Designgranskning mot prototypen","type":"manual","given":"prototyp + byggd app på iPhone och Android","when":"Johan går igenom dashboard, transaktioner, budget, sparmål och inkomst","then":"upplevs som lugn, modern och tydlig i båda lägena","satisfies":["KK-26"]}]},"requirements":{"__reqplan_normalized":true,"sources":[{"kind":"brief","label":"plans/kronkoll/requirements.json","exported_at":"","note":"Krav framtagna ur Johans brief (2026-11-01) och svar på förtydligande frågor: en användare i MVP (datamodell förberedd för hushåll), två kategorinivåer med färdig mall, maximal historik vid första koppling, Web Push i PWA, föräldrapenning som uppskattning med manuell justering. Allt som är antaget av agenten är märkt 'Antagande' i planen. KK-29–KK-35 föreslogs av agenten i planen (tidigare SYN-1–SYN-7) och flyttades in efter godkänd granskning 2026-11-01.","brief":"## Mål\nEn modern, snygg och säker budgetapp för mitt hushåll som automatiskt hämtar transaktioner från mina konton och kort, och ger tydlig insyn i vart pengarna går, hur vi ligger till mot budget och sparmål, och hur inkomsten påverkas av föräldraledighet.\n\n## Hårda krav\n- Helt gratis att driva. Cloudflare free tier: Workers (API + Cron Triggers för polling), D1 (SQLite), Pages (frontend som PWA), Cloudflare Access (inloggning, endast inbjudna e-postadresser). Deploy via GitHub Actions + Wrangler. Ingen egen domän krävs, kör på *.pages.dev / *.workers.dev.\n- TypeScript genom hela stacken.\n- Bankdata via Enable Banking, Restricted Production-läge (privat bruk, endast egna länkade konton). JWT signeras med privat RSA-nyckel via WebCrypto i Workern. Sandbox under utveckling.\n- Säkerhet först: repot kan vara publikt, så inga hemligheter eller bankdata i repot. Nycklar som Worker secrets, .dev.vars i .gitignore från första commit, secret scanning på. Endast läsbehörighet mot banken, aldrig betalningar. Minimal datalagring och tydlig radering av bankkopplingar. Gör en kort hotmodell i planen.\n- Svenska i UI, SEK, svenska datum och talformat.\n\n## Arkitektur- och kvalitetsprinciper\n- Modulärt enligt ports & adapters: domänlogiken (kategorisering, budget, sparmål, inkomstprognos) är ren TypeScript utan beroenden till Cloudflare eller Enable Banking. Bankleverantör, databas och notiser ligger bakom egna gränssnitt så att de kan bytas, t.ex. Enable Banking mot CSV-import eller annan leverantör om villkoren ändras.\n- TDD: skriv test först för all domänlogik. Planen ska visa vilka moduler som drivs av unit-tester och vilka som behöver integrationstester.\n- Teststack (gratis): Vitest för unit, @cloudflare/vitest-pool-workers för Workers och D1 i riktig runtime, kontraktstester mot Enable Bankings sandbox för bankadaptern, Playwright för E2E av kritiska flöden (koppla bank, kategorisera, sätta budget, sparmål). Stryker för mutationstestning av domänlagret.\n- Kvalitetsgrindar i GitHub Actions: lint, typecheck, tester, coverage-tröskel (förslag: 90 % på domänlagret, lägre krav på UI) och mutation score på domänlagret. Ingen deploy om något fallerar.\n- Testdata: syntetiska fixtures och sandbox, aldrig riktig bankdata i tester, loggar eller repo.\n- Allt verktyg och all drift ska vara gratis. Föreslå inget som kräver betald plan och flagga om något riskerar att bli det.\n\n## Banker och kort\n- Skandia (konto + Visa-kort). Första spike: lista ASPSP:er för SE via Enable Banking-API:t, bekräfta att Skandia finns och om kortet kommer som eget konto. Om något saknas: CSV-import som reserv.\n- Polling några gånger per dygn (inga webhooks för kontodata). Hantera att samtycket går ut och behöver förnyas med BankID: tydlig påminnelse och ett enkelt \"koppla om\"-flöde.\n- Deduplicering av transaktioner mellan hämtningar, hantering av preliminära vs bokförda transaktioner.\n- Notera i planen att American Express inte går att koppla i Sverige.\n\n## Funktioner\n- Översikt/dashboard: saldo, månadens in och ut, kvar att spendera, trend över tid.\n- Kategorisering: automatiska regler (t.ex. på motpart/beskrivning) som lär sig av mina manuella ändringar. Möjlighet att dela upp en transaktion.\n- Budget per kategori och månad, med tydlig visning av utfall vs plan.\n- Sparmål: belopp, måldatum, kopplat konto eller manuell avsättning, prognos för när målet nås i nuvarande takt.\n- Inkomst: skilja på lön, föräldrapenning (Försäkringskassan) och andra inkomster. Visa jämförelse över tid och låt mig planera kommande ledighetsperioder så att budget och sparmål räknas om med lägre inkomst.\n- Insikter: största utgiftsposter, återkommande dragningar/prenumerationer, avvikelser mot tidigare månader.\n- Fungera utmärkt i mobilen (PWA, installbar).\n\n## Design\nSka kännas modernt och top notch, i klass med de bästa privatekonomiapparna. Lugn, ren estetik, bra typografi, mörkt och ljust läge, snygga diagram, mjuka animationer. Ta fram prototyp av dashboard, transaktionslista, budgetvy, sparmål och inkomstvy.\n\n## Öppna frågor (besvarade 2026-11-01)\n- En användare eller gemensam vy? → **Bara jag i MVP**, datamodellen förbereds för hushåll.\n- Hur granulär kategorisering? → **Två nivåer med färdig svensk mall** som går att redigera.\n- Historik vid första koppling? → **Så mycket banken ger.**\n- Notiser? → **Web Push i PWA:n.**\n- (Tillagd) Föräldraledighet → **Uppskattning från SGI-regler + manuell justering.**","confirmed":true}],"product":null,"revision":null,"phases":[],"requirements":[{"id":"KK-1","title":"Gratis drift på Cloudflare free tier","statement":"Hela lösningen (API, schemalagd hämtning, databas, frontend, inloggning, CI/CD) ska kunna drivas utan kostnad på Cloudflare free tier (Workers, Cron Triggers, D1, Pages, Access) och GitHub, utan egen domän (*.pages.dev / *.workers.dev).","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Granskning av arkitektur och wrangler-konfiguration mot Cloudflares free-gränser; månatlig manuell kontroll av användning i Cloudflare-dashboarden.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-1-A","req":"KK-1","title":"","text":"Ingen komponent, tjänst eller verktyg i arkitekturen kräver betald plan; komponenter som riskerar att bli betalda är flaggade i planen med en gratis reserv.","form":"assertion","structured":null,"status":""},{"id":"KK-1-B","req":"KK-1","title":"","text":"Normal användning (en användare, 2 schemalagda hämtningar/dygn plus manuella) ligger med god marginal under free-gränserna för Workers-anrop, D1-läsningar/skrivningar och Cron Triggers.","form":"assertion","structured":null,"status":""},{"id":"KK-1-C","req":"KK-1","title":"","text":"Given en push till main där alla kvalitetsgrindar är gröna, when GitHub Actions kör deploy-jobbet, then Worker, D1-migreringar och Pages deployas med Wrangler utan manuella steg och utan egen domän","form":"scenario","structured":{"form":"scenario","given":"en push till main där alla kvalitetsgrindar är gröna","when":"GitHub Actions kör deploy-jobbet","then":"Worker, D1-migreringar och Pages deployas med Wrangler utan manuella steg och utan egen domän"},"status":""}]},{"id":"KK-2","title":"Inloggning en {"id":"KK-17","title":"Översikt (dashboard)","statement":"Översikten visar saldo, månadens inkomster och utgifter, kvar att spendera och trend över tid.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-test av beräkningen \"kvar att spendera\"; E2E att dashboarden visar rätt värden för en syntetisk månad.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-17-A","req":"KK-17","title":"","text":"Visar totalt saldo över valda konton, månadens in, ut och netto, samt tidpunkt för senaste synk.","form":"assertion","structured":null,"status":""},{"id":"KK-17-B","req":"KK-17","title":"","text":"\"Kvar att spendera\" = budgeterade utgifter för månaden − utfall hittills (bokförda + preliminära), med kvar per dag till månadens slut.","form":"assertion","structured":null,"status":""},{"id":"KK-17-C","req":"KK-17","title":"","text":"Visar trend för in/ut de senaste 12 månaderna som diagram.","form":"assertion","structured":null,"status":""}]},{"id":"KK-18","title":"Automatisk kategorisering som lär sig","statement":"Transaktioner kategoriseras automatiskt med regler på motpart/beskrivning i en tvånivåers kategorimall (redigerbar). När användaren ändrar kategori lär sig systemet en regel så att liknande transaktioner kategoriseras likadant framöver.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-tester (TDD) för regelmatchning, normalisering av motpart och regelinlärning; E2E för manuell omkategorisering.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-18-A","req":"KK-18","title":"","text":"Vid start finns en svensk mall med ~12 huvudkategorier och underkategorier som kan byta namn, läggas till, slås ihop och arkiveras.","form":"assertion","structured":null,"status":""},{"id":"KK-18-B","req":"KK-18","title":"","text":"Given en okategoriserad transaktion från \"ICA NARA SOFO\", when användaren väljer Mat › Livsmedel och bekräftar \"Gör alltid så för ICA\", then skapas en regel på normaliserad motpart och framtida ICA-transaktioner kategoriseras automatiskt","form":"scenario","structured":{"form":"scenario","given":"en okategoriserad transaktion från \"ICA NARA SOFO\"","when":"användaren väljer Mat › Livsmedel och bekräftar \"Gör alltid så för ICA\"","then":"skapas en regel på normaliserad motpart och framtida ICA-transaktioner kategoriseras automatiskt"},"status":""},{"id":"KK-18-C","req":"KK-18","title":"","text":"Manuellt satt kategori skrivs aldrig över av regler; användaren kan välja att applicera en ny regel på historiska transaktioner.","form":"assertion","structured":null,"status":""}]},{"id":"KK-19","title":"Dela upp transaktion","statement":"En transaktion ska kunna delas upp i flera delar med egna kategorier, där delarna summerar till originalbeloppet.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-test av uppdelningsvalidering; E2E av uppdelning i transaktionsdetaljen.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-19-A","req":"KK-19","title":"","text":"Given ett köp på 1 240,00 kr, when användaren delar det i 900 kr Mat och 340 kr Hushåll, then räknas delarna i respektive budget och originalet visas med en uppdelningsikon","form":"scenario","structured":{"form":"scenario","given":"ett köp på 1 240,00 kr","when":"användaren delar det i 900 kr Mat och 340 kr Hushåll","then":"räknas delarna i respektive budget och originalet visas med en uppdelningsikon"},"status":""},{"id":"KK-19-B","req":"KK-19","title":"","text":"Uppdelningen kan inte sparas om delarna inte summerar exakt till originalbeloppet; kvarvarande belopp visas.","form":"assertion","structured":null,"status":""}]},{"id":"KK-20","title":"Budget per kategori och månad","statement":"Användaren sätter budget per kategori och månad och ser tydligt utfall mot plan.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-test av budgetberäkningen; E2E av att sätta budget och se utfall.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-20-A","req":"KK-20","title":"","text":"Budget kan sättas på huvud- eller underkategori, kopieras från föregående månad eller föreslås från snitt de senaste 3 månaderna.","form":"assertion","structured":null,"status":""},{"id":"KK-20-B","req":"KK-20","title":"","text":"Varje kategori visar budget, utfall, kvar och andel; över 100 % markeras tydligt (färg + text, inte bara färg).","form":"assertion","structured":null,"status":""},{"id":"KK-20-C","req":"KK-20","title":"","text":"Interna överföringar mellan egna konton och betalning av kortfaktura räknas inte som utgift.","form":"assertion","structured":null,"status":""}]},{"id":"KK-21","title":"Sparmål med prognos","statement":"Sparmål har belopp, måldatum och antingen ett kopplat konto (saldo räknas) eller manuella avsättningar. Appen visar prognos för när målet nås i nuvarande takt.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-tester (TDD) för prognosberäkningen inklusive kantfall; E2E av att skapa sparmål.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-21-A","req":"KK-21","title":"","text":"Given mål 60 000 kr, nuvarande 21 500 kr och snittsparande 3 200 kr/mån senaste 3 mån, when prognosen räknas, then visas beräknat datum (13 månader) och om det är före eller efter måldatum samt belopp/mån som krävs","form":"scenario","structured":{"form":"scenario","given":"mål 60 000 kr, nuvarande 21 500 kr och snittsparande 3 200 kr/mån senaste 3 mån","when":"prognosen räknas","then":"visas beräknat datum (13 månader) och om det är före eller efter måldatum samt belopp/mån som krävs"},"status":""},{"id":"KK-21-B","req":"KK-21","title":"","text":"Ett mål med noll eller negativ sparttakt visar \"nås inte i nuvarande takt\" i stället för ett datum.","form":"assertion","structured":null,"status":""}]},{"id":"KK-22","title":"Inkomsttyper och jämförelse","statement":"Inkomster klassas som lön, föräldrapenning (Försäkringskassan) eller övrigt, och kan jämföras över tid.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-test av inkomstklassificeringen; E2E av inkomstvyn.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-22-A","req":"KK-22","title":"","text":"Inbetalningar från Försäkringskassan klassas automatiskt som föräldrapenning och lön identifieras via arbetsgivarens motpartsnamn; klassningen kan ändras manuellt och lär en regel.","form":"assertion","structured":null,"status":""},{"id":"KK-22-B","req":"KK-22","title":"","text":"Inkomstvyn visar staplat diagram per månad (lön / föräldrapenning / övrigt) för de senaste 12–24 månaderna.","form":"assertion","structured":null,"status":""}]},{"id":"KK-23","title":"Planera föräldraledighet","statement":"Användaren planerar kommande ledighetsperioder (datum, dagar per vecka, ev. föräldralön). Appen uppskattar inkomsten (≈80 % av SGI upp till Försäkringskassans tak, parametrar per år) som kan justeras manuellt, och räknar om budget och sparmål.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-tester (TDD) för inkomstprognosen med årsparametrar; E2E av att lägga till en period och se omräknade sparmål.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-23-A","req":"KK-23","title":"","text":"Given en planerad period 2027-03-01–2027-08-31, 5 dagar/vecka, when perioden sparas, then visas uppskattad nettoinkomst per månad (lön vs föräldrapenning + ev. föräldralön) och skillnaden mot normal månad","form":"scenario","structured":{"form":"scenario","given":"en planerad period 2027-03-01–2027-08-31, 5 dagar/vecka","when":"perioden sparas","then":"visas uppskattad nettoinkomst per månad (lön vs föräldrapenning + ev. föräldralön) och skillnaden mot normal månad"},"status":""},{"id":"KK-23-B","req":"KK-23","title":"","text":"Uppskattningen kan skrivas över manuellt per period; det manuella värdet används i alla beräkningar.","form":"assertion","structured":null,"status":""},{"id":"KK-23-C","req":"KK-23","title":"","text":"Sparmålsprognoser och \"kvar att spendera\" för berörda månader räknas om med den lägre inkomsten och visar påverkan (t.ex. \"Resa: nås 3 mån senare\").","form":"assertion","structured":null,"status":""}]},{"id":"KK-24","title":"Insikter","statement":"Appen visar största utgiftsposter, återkommande dragningar/prenumerationer och avvikelser mot tidigare månader.","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"Unit-tester för detektering av återkommande dragningar och avvikelser med syntetiska serier.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-24-A","req":"KK-24","title":"","text":"Återkommande dragningar (samma motpart, liknande belopp, månatligt/årligt intervall) listas med nästa förväntade datum och årskostnad.","form":"assertion","structured":null,"status":""},{"id":"KK-24-B","req":"KK-24","title":"","text":"En kategori vars utfall avviker mer än 30 % och minst 500 kr från snittet de 3 föregående månaderna visas som avvikelse.","form":"assertion","structured":null,"status":""},{"id":"KK-24-C","req":"KK-24","title":"","text":"Topp 5 största utgifter och kategorier för månaden visas.","form":"assertion","structured":null,"status":""}]},{"id":"KK-25","title":"Mobil först, installbar PWA","statement":"Appen fungerar utmärkt i mobilen och kan installeras som PWA (manifest, service worker, offline-skal).","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Lighthouse PWA/installability-kontroll i CI (gratis) och Playwright i mobil viewport.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-25-A","req":"KK-25","title":"","text":"Appen har web app manifest, ikoner och service worker och kan läggas till på hemskärmen i iOS Safari och Android Chrome.","form":"assertion","structured":null,"status":""},{"id":"KK-25-B","req":"KK-25","title":"","text":"Utan nätverk visas senast hämtade översikt med tydlig markering \"offline – visar data från \u003ctid>\"; bankdata cachas inte längre än 24 h på enheten.","form":"assertion","structured":null,"status":""}]},{"id":"KK-26","title":"Modern design, mörkt och ljust läge","statement":"Designen ska kännas modern och lugn i klass med de bästa privatekonomiapparna: ren estetik, bra typografi, mörkt och ljust läge, snygga diagram och mjuka animationer, utan att ge avkall på tillgänglighet.","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Manuell designgranskning av prototypen; automatisk kontrastkontroll (axe i Playwright) i båda lägena.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-26-A","req":"KK-26","title":"","text":"Ljust och mörkt läge följer systeminställningen och kan väljas manuellt; båda klarar WCAG AA-kontrast.","form":"assertion","structured":null,"status":""},{"id":"KK-26-B","req":"KK-26","title":"","text":"Animationer är korta (≤ 250 ms) och stängs av vid prefers-reduced-motion.","form":"assertion","structured":null,"status":""},{"id":"KK-26-C","req":"KK-26","title":"","text":"Bekräftelser (t.ex. efter synk, sparad regel eller ändrad kategori) visas som en kort notis ovanför menyn som försvinner av sig själv efter cirka 4 sekunder. Fel ligger kvar tills användaren stänger dem eller försöker igen.","form":"assertion","structured":null,"status":""}]},{"id":"KK-27","title":"Notiser via Web Push","statement":"Användaren kan slå på gratis Web Push-notiser i PWA:n för: samtycke går snart ut, budget överskriden och synk som misslyckats upprepade gånger.","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"Unit-test av notisregler; integrationstest av push-adaptern (VAPID-signering, kryptering) mot lokal mottagare; manuell test på iOS och Android.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-27-A","req":"KK-27","title":"","text":"Given notiser påslagna och en kategori som passerar 100 % av budget, when synken har kategoriserat nya transaktioner, then skickas en push \"Mat har passerat budget (104 %)\" utan belopp per transaktion, högst en gång per kategori och månad","form":"scenario","structured":{"form":"scenario","given":"notiser påslagna och en kategori som passerar 100 % av budget","when":"synken har kategoriserat nya transaktioner","then":"skickas en push \"Mat har passerat budget (104 %)\" utan belopp per transaktion, högst en gång per kategori och månad"},"status":""},{"id":"KK-27-B","req":"KK-27","title":"","text":"Samtyckespåminnelse skickas 14, 3 och 0 dagar före utgång.","form":"assertion","structured":null,"status":""}]},{"id":"KK-28","title":"En användare, inget hushåll","statement":"Kronkoll är byggd för en användare: ägaren. Hushåll med flera användare, partnerinbjudan och delade eller egna konton ingår inte (ägarens beslut 2026-11-01). (Motiv: Håller datamodell, behörigheter och UI enkla. Enable Bankings villkor tillåter dessutom bara att läsa konton som tillhör den som länkade dem.)","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"Granskning av datamodellen och Access-policyn; den manuella Access-kontrollen visar att bara ägarens e-post släpps in.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-28-A","req":"KK-28","title":"","text":"Datamodellen har inga hushålls-, ägar- eller synlighetsfält, och appen har inga funktioner för att bjuda in eller växla mellan personer. Appens inställningar (t.ex. periodens startdag) ligger i en enda inställningspost.","form":"assertion","structured":null,"status":""}]},{"id":"KK-29","title":"CSRF-skydd och signerad state i bankflödet","statement":"Ändrande API-anrop kräver samma origin och en egen header. Callbacken från banken accepteras bara med ett engångs-state som är HMAC-signerat, kort giltigt och bundet till den inloggade användaren. (Motiv: Callbacken är ett klassiskt mål för CSRF och för att injicera någon annans koppling. Access-cookien skyddar inte mot det.)","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Integrationstest: callback med manipulerat, återanvänt eller utgånget state ger 400; POST utan X-Kronkoll-header eller med fel Origin ger 403.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-29-A","req":"KK-29","title":"","text":"Given ett state som redan använts eller är äldre än 15 min, when callbacken anropas, then avvisas den med 400 och ingen session skapas","form":"scenario","structured":{"form":"scenario","given":"ett state som redan använts eller är äldre än 15 min","when":"callbacken anropas","then":"avvisas den med 400 och ingen session skapas"},"status":""},{"id":"KK-29-B","req":"KK-29","title":"","text":"POST/PUT/PATCH/DELETE utan header X-Kronkoll: 1 eller med främmande Origin avvisas med 403.","form":"assertion","structured":null,"status":""}]},{"id":"KK-30","title":"Strikt CSP och säker rendering av banktexter","statement":"Motpartsnamn och beskrivningar från banken behandlas som opålitlig indata: de renderas alltid som text, och appen levereras med en strikt Content-Security-Policy utan inline-skript. (Motiv: Butiker och avsändare styr själva texten i transaktionerna. En betalning med ett namn som innehåller HTML eller skript får inte kunna köras i appen (lagrad XSS).)","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-/komponenttest med fixture vars motpart innehåller \u003cimg onerror>; E2E kontrollerar CSP-headern; lint förbjuder dangerouslySetInnerHTML.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-30-A","req":"KK-30","title":"","text":"En transaktion med motparten `\u003cimg src=x onerror=alert(1)>` visas som ren text och inget skript körs.","form":"assertion","structured":null,"status":""},{"id":"KK-30-B","req":"KK-30","title":"","text":"Svaren har CSP med default-src 'self', script-src 'self', frame-ancestors 'none' och connect-src 'self'.","form":"assertion","structured":null,"status":""}]},{"id":"KK-31","title":"Härdad leveranskedja","statement":"GitHub Actions pinnas på commit-SHA. GITHUB_TOKEN har minsta behörighet och Cloudflare-API-token är begränsad till Workers/Pages/D1 för ett konto. Beroenden hålls få, låses i lockfile, installeras med --ignore-scripts och bevakas av Dependabot. (Motiv: Med ett publikt repo och en Worker som har bankens privata nyckel är ett skadligt beroende eller en kapad action den mest sannolika vägen till dataläcka.)","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"CI-lint (t.ex. zizmor/actionlint) på workflows; manuell granskning av tokenbehörigheter.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-31-A","req":"KK-31","title":"","text":"Alla `uses:` i workflows pekar på en fullständig commit-SHA och varje workflow deklarerar `permissions:` explicit.","form":"assertion","structured":null,"status":""}]},{"id":"KK-32","title":"Backup och radering med kända gränser","statement":"D1 Time Travel används som backup. Raderingskvittensen säger ärligt att raderad data finns kvar i Cloudflares återställningspunkter i upp till 7 dagar (antagande A-3) och sedan är borta. (Motiv: Kravet på tydlig radering (KK-11) måste stämma med hur plattformen faktiskt sparar ögonblicksbilder.)","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"Manuell kontroll av D1 Time Travel-inställningen och kvittenstexten i E2E.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-32-A","req":"KK-32","title":"","text":"Kvittensen efter radering anger vad som raderats och att återställningspunkter förfaller inom 7 dagar.","form":"assertion","structured":null,"status":""}]},{"id":"KK-33","title":"Månadsgränser i svensk tid","statement":"Alla månads- och dagsgränser (budget, översikt, prognoser) räknas i Europe/Stockholm, och bokföringsdatum (datum utan tid) tolkas som svenska kalenderdagar. (Motiv: Workers körs i UTC. Ett kortköp den 31:a kl. 23.30 hamnar annars i fel månad.)","type":"functional_requirement","strength":"must","status":"","phase":"","rationale":"","verification":"Unit-tester med en klocka som injiceras via Clock-porten, runt månadsskifte och sommartidsomställning.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-33-A","req":"KK-33","title":"","text":"Given en transaktion med booking_date 2026-10-31, when budget för oktober och november räknas, then räknas den i oktober oavsett serverns UTC-tid","form":"scenario","structured":{"form":"scenario","given":"en transaktion med booking_date 2026-10-31","when":"budget för oktober och november räknas","then":"räknas den i oktober oavsett serverns UTC-tid"},"status":""}]},{"id":"KK-34","title":"Budgetperiod kan börja på lönedagen","statement": saldot listas varje konto med sitt namn (eget namn enligt KK-37, annars bankens maskerade namn) och saldo i SEK från senaste synk. Summan av kontona är totalsaldot.","form":"assertion","structured":null,"status":""},{"id":"KK-38-B","req":"KK-38","title":"","text":"Given ett konto där banken inte har lämnat något saldo, when översikten visas, then står det Saldo saknas för kontot, och totalsaldot räknar bara konton som har saldo","form":"scenario","structured":{"form":"scenario","given":"ett konto där banken inte har lämnat något saldo","when":"översikten visas","then":"står det Saldo saknas för kontot, och totalsaldot räknar bara konton som har saldo"},"status":""}]},{"id":"KK-39","title":"Räkna inte en transaktion","statement":"Användaren kan markera en transaktion som Räknas inte, för hand eller med en regel. Den räknas då inte i budget, översikt eller trend, men syns nedtonad i transaktionslistan och kan ångras. (Motiv: till exempel utlägg som betalas tillbaka, eller köp som inte hör till hushållets ekonomi. Ägarens önskemål 2026-11-04.)","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"Unit-tester (TDD) för att undantagna transaktioner inte räknas i budget och översikt; API-test av markering och regel; E2E att markera och ångra.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-39-A","req":"KK-39","title":"","text":"Given en utgift på 1 299 kr i november, when den markeras Räknas inte, then minskar novembers utgifter och budgetens utfall med 1 299 kr, och raden i Transaktioner är nedtonad med texten Räknas inte (inte bara färg)","form":"scenario","structured":{"form":"scenario","given":"en utgift på 1 299 kr i november","when":"den markeras Räknas inte","then":"minskar novembers utgifter och budgetens utfall med 1 299 kr, och raden i Transaktioner är nedtonad med texten Räknas inte (inte bara färg)"},"status":""},{"id":"KK-39-B","req":"KK-39","title":"","text":"Markeringen kan tas bort i transaktionen, och då räknas den igen.","form":"assertion","structured":null,"status":""},{"id":"KK-39-C","req":"KK-39","title":"","text":"En regel kan ha åtgärden Räkna inte i stället för en kategori. Den gäller alla transaktioner den träffar direkt, gamla som nya, och innan regeln sparas visas hur många den träffar. Tas regeln bort räknas träffarna igen. En transaktion som användaren själv har markerat eller avmarkerat ändras aldrig av en regel (som KK-18-C). (Ändrat 2026-11-04 efter ägarens beslut: inte \"tidigare efter en fråga\".)","form":"assertion","structured":null,"status":""},{"id":"KK-39-D","req":"KK-39","title":"","text":"Kontots saldo påverkas inte, eftersom det kommer från banken.","form":"assertion","structured":null,"status":""}]},{"id":"KK-40","title":"Ta bort en periods budget","statement":"Användaren kan ta bort hela budgeten för en period, efter en fråga om bekräftelse. (Ägarens önskemål 2026-11-04.)","type":"functional_requirement","strength":"should","status":"","phase":"","rationale":"","verification":"API-test mot lokal D1 att bara vald period tas bort och att CSRF-skyddet gäller; komponenttest av bekräftelsen.","parent":null,"children":[],"dependencies":[],"flags":[],"negative_scope":false,"synthetic":false,"acs":[{"id":"KK-40-A","req":"KK-40","title":"","text":"Given november har budget för fem kategorier, when användaren väljer Ta bort budget och bekräftar, then har november ingen budget, och budgetvyn visar utfallet utan plan, som en period som aldrig har haft budget","form":"scenario","structured":{"form":"scenario","given":"november har budget för fem kategorier","when":"användaren väljer Ta bort budget och bekräftar","then":"har november ingen budget, och budgetvyn visar utfallet utan plan, som en period som aldrig har haft budget"},"status":""},{"id":"KK-40-B","req":"KK-40","title":"","text":"Avbryt ändrar ingenting, och andra perioders budget påverkas inte.","form":"assertion","structur
